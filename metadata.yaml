name: astrbot_plugin_petpark

display_name: 灵契仙途

desc: 灵契仙途：修士职业、灵宠伙伴、真实回合战斗、山海历练、三人秘境、世界首领和深渊抉择；兼容原有存档与玩法。新增多宗门（一界多门、2000天晶建宗、活跃度扩招人数上限）、悟性加点、修士体力、修为翻倍、经验书与形象卡；宗门任务改为目标制（需完成指定任务才领奖）并给宗门操作加冷却；西仓库换品（体力/材料/货币）与商城列表改用md表格；修士卡显示体力、道具效果全中文、体力与翻倍道具改天晶计价；卡片内嵌大图压成WebP（修士卡HTML从~20MB降到~200KB）；新增五行属性克制：灵根决定修士属性、宠物按种类带属性，战斗内克敌伤害×1.2/被克×0.85，修士图补全灵根/神通/属性相克与结契灵宠属性。宝石类材料价格已上限至60万以内。v3.6.0 玩家反馈整改：修士卡/文本补体力条、灵根实际加成(金→攻+10%)、神通被动效果；体力改1点/分钟恢复并在各宗门行动(任务10/探索20/镇守15)标注消耗与去处；修士突破连升N级；新增「外出历练」免费随机历练(15分钟冷却)；宗门任务随机二选一(打怪两次/通关地图一次)须真正去打；宗门捐献改吸灵石(10灵石=1帮贡)；道具商城锻造材料引导、改名卡(宠物)/改名符(修士道号)交叉澄清。v3.6.1 数据隔离修正：「清空本群用户数据」不再清摸金/下棋/扫雷(跨群共享)，家园按群隔离、本群重置只清本群份。v3.6.2 修复无效果指令：「设为无限服/设为官方服/宠物解锁/宠物锁定」仅存在于 dispatch 分支、未注册进 KNOWN_COMMANDS，被群聊分发过滤层 return None 吞掉（看似无效果）；已注册，指令恢复可用。v3.6.3 商城/深渊商店/排行榜等 md 表格统一在表头前加空行，避免 QQ 官方 Markdown 把紧贴标题的表格当成 md 区块（吞成一团），改为正常渲染成表格。v3.7.0 职业系统扩展与卡牌布局重构：新增「魔修」职业（以血催煞·攻击汲取生命，六师九品各具名）；锻造/装备进阶/洗炼改为按修士职业识别装备名（魔修/剑修/体修/灵修各有成套命名，不再只认通用名）；修士卡重构为「修行资源/当前体力/战斗配置/修炼进度」四卡分区 + 灵根神通网格 + 战力构成 + 三列动作栏，并修复长道号与魔修长装备名横向裁切（白字溢出/左右裁断），长文本自动折行。数据 schema_version 升至 7。v3.7.1 修复山海仙途图渲染：地图内嵌图（世界背景+20关地标）原为满分辨率 PNG（合计约47MB），拼成单张 HTML 后达 ~63MB，在内存吃紧的渲染机（2核/1.9GB+swap、V8 上限256MB）上触发 set_content 超时 / Page crashed，且超出渲染农场 2MB 上限，导致「仙途地图」恒出「图片暂时生成失败」。现按卡片实际显示尺寸（世界图≈800×1200、地标≈240²）压成 WebP，整图 HTML 降至 ~0.6MB，本地渲染与农场兜底均可正常工作。v3.7.2 修复心情 1 星后玩耍被锁死的死循环：玩耍是唯一能恢复心情的日常动作，但 `_busy_reason` 在心情≤1 时连玩耍一并拦截，又没有恢复心情道具/自动回复，导致宠物心情 1 星 → 玩耍被封 → 无法恢复 → 永久锁死。现玩耍豁免「心情 1 星」门槛（死亡/假死仍照常拦截），心情 1 星时仍可玩耍回满★★★★★。v3.8.0 坐骑外观定制与槽位绑定：后台新增「坐骑定制卡」（兑换解锁已有坐骑外观定制，仅换形象不改名字与战力）；bot.flyyye.cn 玩家中心绑定升级为槽位（群号+用户ID 一次绑定，修士/宠物/坐骑统一管理，纯修士玩家亦可绑定）；我的修士/我的坐骑网页展示；坐骑外观上传走后台人工审核（审核页按 宠物/坐骑 类型筛选）；群聊坐骑入场/卡片优先显示定制外观；「定制坐骑」指令引导网页自助。v3.8.1 定制坐骑形态确定：坐骑定制=新建一只定制坐骑（自定义名+专属外观图，初始战力 30 万，Lv.1 可升级、属性不可自定义；每张坐骑定制卡 1 只，人工审核后生成并自动登场）。v3.8.2 玩家中心布局以修士为主：修士档案补全（道号/职业/性别/境界/洞天/灵根/属性/体力/悟性/根骨/神通/道侣/战力构成明细），下方依次展现宠物档案与坐骑列表；定制坐骑与宠物定制同款支持全群祝贺广播，玩家可填 QQ 名/QQ 号。

