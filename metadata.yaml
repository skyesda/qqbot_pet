name: astrbot_plugin_petpark

display_name: 灵契仙途

desc: 灵契仙途：修士职业、灵宠伙伴、真实回合战斗、山海历练、三人秘境、世界首领和深渊抉择；兼容原有存档与玩法。新增多宗门（一界多门、2000天晶建宗、活跃度扩招人数上限）、悟性加点、修士体力、修为翻倍、经验书与形象卡；宗门任务改为目标制（需完成指定任务才领奖）并给宗门操作加冷却；西仓库换品（体力/材料/货币）与商城列表改用md表格；修士卡显示体力、道具效果全中文、体力与翻倍道具改天晶计价；卡片内嵌大图压成WebP（修士卡HTML从~20MB降到~200KB）；新增五行属性克制：灵根决定修士属性、宠物按种类带属性，战斗内克敌伤害×1.2/被克×0.85，修士图补全灵根/神通/属性相克与结契灵宠属性。宝石类材料价格已上限至60万以内。v3.6.0 玩家反馈整改：修士卡/文本补体力条、灵根实际加成(金→攻+10%)、神通被动效果；体力改1点/分钟恢复并在各宗门行动(任务10/探索20/镇守15)标注消耗与去处；修士突破连升N级；新增「外出历练」免费随机历练(15分钟冷却)；宗门任务随机二选一(打怪两次/通关地图一次)须真正去打；宗门捐献改吸灵石(10灵石=1帮贡)；道具商城锻造材料引导、改名卡(宠物)/改名符(修士道号)交叉澄清。v3.6.1 数据隔离修正：「清空本群用户数据」不再清摸金/下棋/扫雷(跨群共享)，家园按群隔离、本群重置只清本群份。v3.6.2 修复无效果指令：「设为无限服/设为官方服/宠物解锁/宠物锁定」仅存在于 dispatch 分支、未注册进 KNOWN_COMMANDS，被群聊分发过滤层 return None 吞掉（看似无效果）；已注册，指令恢复可用。v3.6.3 商城/深渊商店/排行榜等 md 表格统一在表头前加空行，避免 QQ 官方 Markdown 把紧贴标题的表格当成 md 区块（吞成一团），改为正常渲染成表格。v3.7.0 职业系统扩展与卡牌布局重构：新增「魔修」职业（以血催煞·攻击汲取生命，六师九品各具名）；锻造/装备进阶/洗炼改为按修士职业识别装备名（魔修/剑修/体修/灵修各有成套命名，不再只认通用名）；修士卡重构为「修行资源/当前体力/战斗配置/修炼进度」四卡分区 + 灵根神通网格 + 战力构成 + 三列动作栏，并修复长道号与魔修长装备名横向裁切（白字溢出/左右裁断），长文本自动折行。数据 schema_version 升至 7。v3.7.1 修复山海仙途图渲染：地图内嵌图（世界背景+20关地标）原为满分辨率 PNG（合计约47MB），拼成单张 HTML 后达 ~63MB，在内存吃紧的渲染机（2核/1.9GB+swap、V8 上限256MB）上触发 set_content 超时 / Page crashed，且超出渲染农场 2MB 上限，导致「仙途地图」恒出「图片暂时生成失败」。现按卡片实际显示尺寸（世界图≈800×1200、地标≈240²）压成 WebP，整图 HTML 降至 ~0.6MB，本地渲染与农场兜底均可正常工作。v3.7.2 修复心情 1 星后玩耍被锁死的死循环：玩耍是唯一能恢复心情的日常动作，但 `_busy_reason` 在心情≤1 时连玩耍一并拦截，又没有恢复心情道具/自动回复，导致宠物心情 1 星 → 玩耍被封 → 无法恢复 → 永久锁死。现玩耍豁免「心情 1 星」门槛（死亡/假死仍照常拦截），心情 1 星时仍可玩耍回满★★★★★。v3.8.0 坐骑外观定制与槽位绑定：后台新增「坐骑定制卡」（兑换解锁已有坐骑外观定制，仅换形象不改名字与战力）；bot.flyyye.cn 玩家中心绑定升级为槽位（群号+用户ID 一次绑定，修士/宠物/坐骑统一管理，纯修士玩家亦可绑定）；我的修士/我的坐骑网页展示；坐骑外观上传走后台人工审核（审核页按 宠物/坐骑 类型筛选）；群聊坐骑入场/卡片优先显示定制外观；「定制坐骑」指令引导网页自助。v3.8.1 定制坐骑形态确定：坐骑定制=新建一只定制坐骑（自定义名+专属外观图，初始战力 30 万，Lv.1 可升级、属性不可自定义；每张坐骑定制卡 1 只，人工审核后生成并自动登场）。

short_desc: 修士职业、灵宠助战、组队秘境与世界首领

version: v3.21.0

author: Devin

repo: https://github.com/skyesda/qqbot_pet

changelog: |-
  v3.21.0 月耀华诞玩法扩充：月饼重制挑战链 + 中秋/国庆双段深化（**活动进行中上线，必须整框架冷重启**）。用户诉求原文是「月饼5个首次合成后支持再次合成，通过一系列挑战可合成，越合成难度越大」+「中秋和国庆活动扩充玩法，要求丰富，不要单调、玩法过于简单」，故本版**新增玩法与做深旧玩法并重**，且新机制全部遵守既有铁律：**月华只进不出**（无商店、无兑换、无任何扣月华路径），奖励仍只发月华，主背包与主经济零写入。①**月饼匠心（重制挑战链，P1）**：`做月饼 <口味>` 首次合成照旧一次性 +20 且**无挑战**（入门线）；解锁后再发即**开始一次重制挑战**（新指令 `重制 <答案>` 作答、`重制 放弃` 放弃），`做月饼` 不带参数改为**图鉴与进度**（五口味星级/累计重制次数/当前阶段/今日剩余与冷却）。难度**按该玩家自己的累计重制成功次数分 5 阶段**（0/2/5/9/14 次 → 入门/熟练/精工/匠心/宗师，题数 1/2/3/3/4、时限 30/26/22/18/14 秒、通关月华 20/30/45/70/100），个人挑战链，**后来者不被前置玩家拖累**。一局多步、**答错或超时本局立刻作废**（不是整局重来）；失败代价 = **冷却 + 消耗当日次数**，冷却基础 10 分钟、**每阶段 +5 分钟**（宗师 30 分钟）、上限 60 分钟，每日 3 次。口味星级满 3 星/5 星各发一次一次性奖励（60/120），幂等由 `craft.stars_granted` 的 `口味:星级` 标记保证。②**新挑战题库 `petpark/moonfest/challenges.py`**（与灯谜/巡礼题库**完全分开**，是月饼专属小挑战）：配方记忆、配料倍数心算、火候估时、工序排序、月相推演、Jev 语义题；判分复用 `puzzles.normalize_answer / is_correct`，**不新写判分器**。③**新增 `petpark/moonfest/moonphase.py`**：以已知朔日 2000-01-06 18:14 UTC + 平朔望月 29.530588853 天**纯本地确定性**推算月龄/月相/距望天数，供「月相推演」题与桂花酿近满加成共用一份口径；出战相题时会**丢弃答案压在相界上的题**（距相界 <0.5 天），否则玩家按「每相约 3.7 天」推出来的会是相邻的那一相、题目没有唯一正解。④**Jev 不可用不许放水**：新增 `_Jev.available()`（enabled + 客户端可导入 + 有 Key，全 try/except），**线上当前没配 Jev Key**，此时阶段 4/5 的 Jev 语义题**被等难度确定性题顶掉而不是跳过**，题数一根不少——绝不「Jev 挂了就自动放行」，那会让高阶阶段点两下就过。⑤**中秋新增「桂花酿」**：猜灯谜答对按 `brew_drop_pct`（35%）掉桂花（`拜月` 刻意不赠物，它就是普通签到）；`酿桂花` 耗 3 份桂花起一坛、30 分钟后 `取酒`，每日 1 坛、同时在酿 1 坛；品质三档 清酿/醇酿/酿王，**距望日 ≤`full_moon_window_days`（3 天）时酿王率 ×2**（这是「何时下料」的真实择时深度）。**酒的唯一用途是 `喂玉兔 桂花酿`：按品质抬喂养档位下限（清酿≥无感/醇酿≥喜欢/酿王=非常喜欢）**，因此**酿酒不新增任何月华出口**，产出仍受既有喂食次数封顶；首次酿出各品质各发一次（20/40/80）。⑥**中秋新增「玉兔同行」**：每日 1 局、5 站，每站答对发 4~8 月华、**第 3 站起换难题池并撤掉提示**（本玩法唯一的难度递增手段）、容错 2 次、**5 站零失误额外 +25**；每站月华乘**玉兔亲密度倍率**（由累计喂食次数分 3 级：1.0/1.15/1.3），把原本孤立的「喂养」接进主玩法。⑦**做深「猜灯谜」**：加**连对倍率**（每连对 5 题 +10%、上限 +30%，答错/超时清零，照巡礼既有写法）+ **`猜灯谜 难题` 档**（只抽「谜底 ≥3 字或打一成语/打一物」的难题池，实池 232 道，月华 ×1.5），难题档与普通档**共用**每日 20 题，但另有独立的难题上限 5 题；答错同样清零连对。⑧**国庆新增「献礼」**：**与群里程碑正交的第二条进度轴**——巡礼答对 +1 / 贺词上墙 +3 / 点赞 +1 点，累计到档位（40/120/260/500）向全群参与者各发一次月华。**献礼点绝不写进 `yuehua_total`**（一个看「参与行为」、一个看「产出」，混在一起巡礼答题会顺带推进月华里程碑、两个体系一起崩），阶梯发放走 `_add_yuehua`（不计群累计、不递归触发里程碑），并有测试专门钉死这一点。⑨**国庆新增「双庆」**：仅**双节同庆重叠日**（`_phase() == "both"`，即 10-01）开放的 5 题挑战，中秋灯谜与国庆巡礼交替出题、统一 20 秒时限、**五题全中 +150**、答错即止**且当日不可重来**（`double` 幂等标记）；一年只有一天且一次性，大额奖励不影响日常平衡。`双庆` **刻意不登记进 `_PHASE_GATES`**，改用显式 `both` 判定——登记了就变成「两阶段都能玩」，与设计相反。⑩**做深「巡礼」：单题问答 → 路线闯关**：一条线 5 站、难度逐站递增、**末站必定困难**（顺带修掉一个实现 bug：原式子在低活跃玩家起点档 base=1 时末站只能到 2，路线会全程停在「中等」——而路线化的卖点正是「越走越难、终点有重赏」，终点不够难等于这条线没有终点），答错 2 次本线重置回第 1 站，走完全线 +40、零失误再 +60；`巡礼 换线` 重抽路线并清空进度与连对（不返还题数）。每日题数上限仍走既有 `quiz_daily_limit`。⑪**做深「贺词」：每日主题 + 契合加成**：`firework_themes` 按日期轮换，投稿时展示当日主题，契合再 +10；**Jev 不可用时用本地关键词表判定，认不出就不给加成**（绝不默认白送）。`月华墙` 改**两段式**（最受欢迎按点赞 + 最新上墙，两段编号口径一致=倒序第 n 条，都能直接拿去点赞），并修掉「最新上墙」原本按正序取前 10 条、实为**最旧**的排序错（改为 `reversed(entries[-10:])`）。⑫**新增 `月华信息` 指令**（别名 `我的月华` / `月华档案`，三名等价）：**一条指令看全自己在活动里的全部状态**——累计月华与全服名次、累计签到天数、上墙贺词数、当日各玩法次数表、月饼匠心进度（阶段/累计重制/今日剩余/下一炉题数与时限）、桂花酿坛况、玉兔同行与巡礼进度；按当前阶段**只显示相关段落**（重叠日两段都出并提示双庆），**只读**、不改任何状态，**冷启动玩家在三种阶段下都不报错**，未上榜时名次文案自带单位（不拼出「全服第 未上榜 名」这种病句）。⑬**奖励平衡重算**：新玩法抬高日产出上限（中秋 ≈820~1060、国庆 ≈400~950，估算上限），故**同步上调结算与里程碑档位以保持原比例关系**——`end_rewards` 1→5000 / 2~3→3000 / 4~10→1600 / 11~20→800，`milestones` 1600/3200/6400/11000/16000（每人月华不变或小幅上调），确保「结算加成不反超玩法获得」（top1 5000 vs 现实全勤 4000~6000，与旧档 3000 vs 2500~3500 同比例）。**这两项都是后台 JSON 字段、改配置不是改代码**，上线后可随时在后台回调。⑭**`full_moon_window_days` 默认必须取 3、不能取 1**：2026 年望在 09-26 22:51，而中秋窗从 09-27 才开始，取 1 天窗口时只有 09-27 命中、之后整段活动的近满加成都是死的（今天已是 09-29）；3 天窗口 → 09-27/28/29 连续三天有效，并有测试钉死「中秋窗内至少命中 3 天，退回 1 天窗口测试必红」。⑮**`拜月` 刻意不做月相分档**（用户中途定稿）：它就是每日普通签到、固定月华，原计划的「月相倍率」整体撤掉，`moonphase.py` 只服务月饼题与桂花酿。⑯**顺带修一个线上真实判错**：灯谜题库存「孔明灯」而它在同义表里归到代表写法「心愿灯」，`normalize_answer` 走「答案包含在输入里」那条捷径时没做归一、右边 `is_correct` 却归一了，于是玩家**一字不差地照着答案打「孔明灯」也被判错**；现该分支同样过 `_canon_answer`，并有一条全库自检（每道灯谜/巡礼拿自己的答案原文作答都必须判对）。⑰**后台**：月耀卡片按 **总控/双阶段时间/每日时段/Jev → 中秋·月耀 → 月饼匠心 → 国庆·华诞 → 通用** 分节渲染（原为平铺），新增的全部标量字段归入对应节；阶段曲线/献礼阶梯/主题表/里程碑/结算奖励等结构改走 **JSON 文本框**（解析失败 `alert` **具体是哪一项**并中止保存，不半存），70 个配置键**全部可在后台改**（含 JSON，无一漏项）。⑱**新增 `tests/test_moonfest_challenges.py`（81 条，全绿）**：每日计数器「一处定义」不许绕过（引擎源码正则 + 反射式比对 `_DAILY_KEYS`，防新计数器漏重置这一已知坑）、Jev 不可用不出语义题且题数不减、月相确定性（以 2026 年两个真实望日为锚 + 近满窗口不许窄于 3 天）、挑战失败路径（答错消耗次数并写冷却）、星级/一次性奖励幂等、**献礼点只进 `offering_total` 不污染 `yuehua_total`**、巡礼末站必困难、月华信息（分阶段段落/别名等价/只读/冷启动安全/名次文案），外加一条兜底：「把所有指令用最坏的方式各触发一遍，累计月华不许下降」。**改了 `petpark/`（moonfest 包 + webstatic/admin.js），必须整框架冷重启生效；活动正在运行中，重启前请确认再授权。**
  v3.20.6 存档落盘改「合并写盘」+ 月耀华诞题库各扩到 1000 道以上。①**存档节流合并**（`petpark/store.py`）：线上实测单次全量落盘（7.4MB `petpark.json`）p50 就要 **895ms**、p99 2100ms，而一条群消息常连触发 2～3 次 `store.save()`，实测连击间隔 0.8/1.1/0.9s——即后一次调用几乎总落在前一次的写盘窗口内，不合并等于把同一份 7.4MB 存档白写两三遍，「拜月」等指令的回复就一直卡在 `await save()` 上（实测 reply_ready p50 1774ms）。现把 `save()` 改为**只标记「有改动」并安排一次 250ms 窗口的合并落盘，立刻返回**（不再阻塞回复路径）；新窗口内到达的多次改动合成一次写盘；写盘期间新到的改动留到下一轮补写。落盘本身的语义**一字未动**（加锁 + `json.dumps(ensure_ascii=False, separators=(",",":"))` + 写 `.tmp` → 字节数校验 → 硬链 `.bak` → `replace`），`.bak`/`.tmp` 契约与校验失败时抛 OSError 的行为全部保留。代价是强杀进程时**最多丢 250ms 内的改动**，为此新增 `flush_now()`（立即落盘、不参与合并）并用在「这一刻磁盘必须已是真相」的路径上：插件停机收尾（`main.py`）、后台清档/删玩家数据/删卡密/删反馈/删推送任务/奖池与库存重置/删账号共 7 处破坏性操作（`petpark/webadmin.py`）。②**月耀华诞题库扩充**：新增 `petpark/moonfest/riddles.py`（灯谜）与 `quizzes.py`（巡礼文化常识），均按「结构化事实表 + 生成器」产出、答案由数据行直接给出，**灯谜 1148 道 / 巡礼 1199 道**（并入后按题干去重，手写精选题优先保留，无重复题）。巡礼三档难度 264/422/513，每档都够抽；中秋/国庆主题 548/651。③**同义答法容错**：线上**没配 Jev Key**，灯谜判定只剩字符串比对，玩家答「月球」而谜底是「月亮」、答「小白兔」而谜底是「兔子」都会被判错。新增一层同义组归一（13 组，含月亮/月球、兔子/玉兔、中秋节/中秋、五星红旗/国旗、心愿灯/孔明灯等），**只对「多字谜底 + 无选项的开放题」生效**——字谜谜底是单个汉字，把「日」等同于「太阳」会让「打一字」被「太阳」蒙对；巡礼选择题的答案与干扰项常是「中秋节/中秋」这类近义对，归一化会把干扰项也判对，故一并排除。`engine.py` 的字面命中判定同步改走 `puzzles.is_correct()`，避免归一化换写法后反而把正确答法判错。④修掉两处**提示直接写出谜底**的手写灯谜（桂花、鲜），等于白给。⑤新增 `tests/test_moonfest_banks.py` 固化题库契约（题量≥1000、题干唯一、字段完整、提示不泄漏谜底、同义容错不放宽字谜与选择题），并修正 `tests/test_adventure.py` 中手工 `__new__` 出来的插件实例漏设 `moonfest` 属性导致的 AttributeError。**改了 `petpark/`，必须整框架冷重启生效。**
  v3.20.5 月华榜与结算公告改用 **markdown 表格**渲染（照中元功德榜）：此前 `RANK_ROW` / `SETTLE_ROW` 是「1. 名字｜月华 10｜签到 1 天」这种竖线拼接的纯文本行，QQ 里显示成一串流水句，名次与数据对不齐。现改为标准三行式 md 表格——`| 排名 | 玩家 | 累计月华 | 签到 |` + 对齐分隔行 + 数据行，结算公告则多一列 `| 排名 | 玩家 | 累计月华 | 结算奖励 |`（奖励列写成 `+3000`）。遵守两条既有硬约束（与 v3.6.3 同源）：①**表头前必须留空行**——紧贴标题的表格会被 QQ 官方 Markdown 当成普通区块吞成一团，`RANK_HEADER`/`SETTLE_HEADER` 末尾本就带 `\n`，`"\n".join` 时正好生成这个空行；②**列必须窄**——QQ 渲染超宽表格会退化成纯文本并拆行，故不放 32 位群号之类。玩家名里的 ASCII 竖线统一替换成 `丨`（照中元榜），否则会把表格列切歪；名次列第 4 名起由「4.」改为「4」。月华墙**不动**（贺词是玩家自由文本，长短不一、可能含竖线，塞进表格格子比列表更糟），里程碑回执本就是单行也不动。**改了 `petpark/`，必须整框架冷重启生效。**
  v3.20.4 全群通报改为**只打给「已授权 + 群内已开启灵契仙途」的群**：v3.20.3 修好推送方法名后线上实测，一次月耀全群通报把 store 里**全部 28 个群**都推了一遍，其中 20 个返回「消息发送失败，机器人非群成员」(11293)、8 个「请求的资源不存在(用户/群已注销)」(11255)——`store` 的 `groups` 桶是**历史累积**的，里面躺着大量僵尸群（机器人已退群、群已注销、从未授权、群内已关闭灵契仙途），照单全推只会刷一屏 API 报错，既推不出去还白白试错。①**新增 `main.PetParkPlugin._broadcast_targets()`**：返回真正可推送的 `[(gid, umo)]` = **已授权**（`_is_group_authorized`，`auth_until` 未过期）+ **群内已启用**（`groups[gid].enabled`）+ **记录过 UMO** 三条同时成立；`_do_broadcast` 与活动模块共用它，过滤口径**单一来源**，不再各写一份。②**中元与月耀的 `_push_all_groups` 改为委托宿主的 `_broadcast_to_authorized_groups()`**：目标集与后台其它「全服广播」**完全一致**，发送走框架既有的 Markdown 优先 / 纯文本降级并带成败统计，不再自己遍历 store、也不再退回「模块自家群桶」（那等于「谁来过就推谁」，同样会打到未授权群）。返回值仍是目标群数，为 0 时后台按钮回显失败原因（需已授权 + 群内已开启 + 有 UMO），不假装成功。③群内里程碑公告、中元河灯回音走的是**单群**推送 `_push_group`，目标就是刚发生行为的那个群，不受本次改动影响。**改了 `petpark/` 与 `main.py`，必须整框架冷重启生效。**
  v3.20.3 修复「全群通报测试」点了没反应——**同时暴露中元活动自 2026-09-05 起所有主动推送都是死的**。①**根因是一处悬空方法引用**：`petpark/moonfest/engine.py` 与 `petpark/zhongyuan/engine.py` 的 `_push_group()` 都调 `self.bot._send_to_group(...)`，而该方法在 `06c8779`（2026-09-05「移除整个「宗门」子系统」）中随宗门轴一起从 `main.py` 删掉了——插件主类上的正确名字是 `main.PetParkPlugin._send_group_text`。每次推送都抛 `AttributeError`，又被只打一句「推送群 X 失败」的 `except` 吞掉，于是**全群通报 / 群里程碑公告 / 活动结算公告全部静默失效**，日志里只有一排没有原因的「失败」。中元模块的调用点在删除前后一直没改，**中元的全群通报、群里程碑公告、河灯回音自 2026-09-05 起一条都没发出过**；月耀华诞是照中元骨架写的，从出生起就带着同一个死调用。②修复：两个引擎的 `_push_group` 改调 `_send_group_text`，并把异常原文带进日志（`exc_info=True`），不再只留一句无原因的失败。③`_push_all_groups` 现在**返回目标群数**，且 store 的 groups 桶为空时**回退到模块自己的群桶**（旧写法只在取 store 抛异常时才回退，store 正常但为空会拿到 0 个群却毫无提示），一个群都没有时打明确 warning；后台两处「全群通报测试」按钮改为回显「已向 N 个群发起…」，N 为 0 时返回失败而不是假装成功。④`main._send_group_text` 的两条静默路径也补上原因：取不到 bot 客户端时原来直接 `return`（现打 warning），Markdown 与纯文本双双失败时原来只打一句「主动推送失败」（现带 `exc_info=True`）。**玩家侧可见行为无变化**（此前这些推送本就一条都没发出去），本次只是让它们真正能发、并让日志不再说谎。**改了 `petpark/` 与 `main.py`，必须整框架冷重启生效。**
  v3.20.2 修复月耀华诞 **Jev 在线上恒不可用**（后台「测试 Jev 连接」恒返回「jev_client 不可导入」），两道各自独立的原因、任一道都足以让活动退化成纯本地兜底：①**导入路径错**：`petpark/moonfest/jev.py` 原本写 `from tools.jev_client import …`，但插件被框架以包名 `astrbot_plugin_petpark` 加载时 `sys.path` 上是 `plugins/`（插件根的**父**目录），**插件根自己不在 sys.path 上** → 线上必然 `ModuleNotFoundError: No module named 'tools'`（本地手工探针因 cwd=插件根 才碰巧成功，所以一直没暴露）。现改为用 `importlib.util.spec_from_file_location` 按**文件路径**加载插件根下的 `tools/jev_client.py`，与 sys.path 无关、不复制副本（阈值校准脚本仍共用同一份真源）；手工加载的模块会显式注册进 `sys.modules`。②**后台那个 Key 输入框是死配置**：`jev.api_key` 此前只被读 `enabled`、Key 从没传给客户端（`load_api_key()` 只认环境变量与同目录 `.jev_key`，而 `.jev_key` 是 gitignore 的、服务器上根本不存在，`TYPESAFE_API_KEY` 也未设），**后台填了也不生效**；现新增 `jev.set_api_key()`，`engine._sync_jev()` 在初始化与 `apply_config` 后把配置里的 Key 写进 `TYPESAFE_API_KEY` 环境变量（正是 `load_api_key()` 的最高优先级），并用 `_OWN_ENV_KEY` 区分归属——**只回收自己写的那份，绝不误删框架环境本来设的 Key**。③**`t:'pwd'` 字段补上**：月耀卡片此前只有「启用 Jev 判定」开关、**根本没有 Key 输入框**（文档却写着「Key 只脱敏回显」），现补 `Jev API Key` 密码框，留空=不修改、保存时跳过，不会把脱敏串写回配置。④**`ping()` 给出真实原因**：失败时回带加载器路径 + `异常类型: 原文`（或「请在后台填写 / 环境变量 / .jev_key 路径」），不再只丢一句「不可用」让人无从排查。**改了 `petpark/`，必须整框架冷重启生效；重启后需在后台「节日活动 → 月耀华诞」填入 Jev API Key 并按「测试 Jev 连接」验证。**
  v3.20.1 月耀华诞去掉全部群内管理指令：原「月耀配置 / 月耀开始 / 月耀结束 / 月耀结算」四个管理员指令整体移除，活动开关、双阶段起止时间、全部玩法数值与排行榜/里程碑奖励**只在后台「节日活动」页配置**——要开始/结束活动就改后台的 `phase_*.start_at / end_at`，结算仍由后台循环在两阶段 `end_at` 均已过后自动执行一次（`meta.settled` 幂等）。随之清掉只服务于指令的死代码：`engine._cmd_config/_cmd_start/_cmd_end/_cmd_settle`、`_is_admin/_is_superadmin`、`_phase_text`、`_fmt_time`、`config._EDITABLE_KEYS` 与 `editable_keys()`、模板 `OPEN_TIP/SETTLE_DONE/PHASE_BOTH`；群内 `COMMANDS` 收敛为 12 个玩家玩法指令。「活动帮助」补齐原先漏列的 `点赞` 与 `月华墙` 两条。**改了 `petpark/`，必须整框架冷重启生效。**
  v3.20.0 新增中秋 × 国庆双阶段活动「月耀华诞」（独立模块 `petpark/moonfest/`，数据独立落 `moonfest.json`，删除该目录即整体下架）。**代号「月华」是全场唯一奖励与排行积分，只进不出**：无商店、无商品、无兑换窗口，主玩法背包与主经济**零写入**（全程不调 `store.add_item`）。①**双阶段各自独立配置起止时间**（北京时间，仅后台可改）：中秋·月耀默认 2026-09-27 00:00 ~ 10-01 23:59，国庆·华诞默认 10-01 00:00 ~ 10-07 23:59，**10-01 为双节同庆重叠日，两阶段玩法同时开放**；活动状态机返回 `midautumn / national / both / None`，未在窗口内的玩法按阶段给出「当前未开放」而不吞指令。②**玩法全部接入 Jev（TypeSafe System One）判定器**（`tools/jev_client.py`，非文本生成）：猜灯谜用 `noul` 判「玩家答案与谜底语义等价」（兼容谐音/别解/近义，字面命中仍无条件放行兜底）；喂玉兔用 `score` 四档（厌恶/无感/喜欢/非常喜欢 → 5/10/20/30 月华）；华诞巡礼用 `score` 按玩家累计月华/签到天数/连对自适应难度（简单/中等/困难 → 题目子集与月华档）；贺词用 **noul 合规闸 + choice 主题闸同一次请求并行问完**（严格遵守「单条玩家消息最多 1 次 Jev 请求」）。**Jev 缺 key / 超时 / 抛 `SystemExit` 一律确定性本地兜底**（灯谜回字面比对、喂兔固定 10 月华、巡礼固定中等、贺词走本地敏感词表后保守放行），活动不会因 Jev 挂掉而瘫痪。③**活动结束才结算排行榜奖励**（用户要求）：中秋段结束**不发**、国庆段结束**不发**，只有两阶段 `end_at` 均已过才由后台循环触发**唯一一次** `_settle()`，按全服总榜（按 QQ 全局唯一，跨群合并）前 20 名发放纯月华（1 名 3000 / 2~3 名 2000 / 4~10 名 1000 / 11~20 名 500，均写回活动 `players` 桶的 `yuehua_earned`），`meta.settled` 幂等保护，重复触发不重发。④**奖励平衡**：满勤日入约 560（中秋）/281（国庆），全勤约 4767 理想值，top1 结算 3000 ≤ 现实全勤产出，确保**结算加成不反超玩法获得**；群里程碑 5 档（1000/2000/4000/7000/10000 → 每人 5/10/15/25/40 月华）只发活动内月华、只抬高排行竞争不灌水主经济。⑤**防刷**：签到 1 次/日（中秋国庆各自独立，10-01 当天两个签到都可完成）、灯谜 20 题/日、喂养 10 次/日（冷却 10 分钟）、巡礼 20 题/日、贺词 3 条/日、点赞 5 次/日，月饼仅每种口味**首次**合成给 20 月华（重复只计收集册）、点赞不可自赞。⑥**后台入口并入「节日活动」统一管理页**：原「中元活动」标签升级为**节日活动管理模块**（侧边栏同名标签，活动运营组），一页统一管理中元与月耀华诞两个节日活动——进页时并行拉取两套配置、上下两张卡片分别渲染，各自独立保存互不影响；月耀卡片含双阶段时间/每日时段/Jev 开关/全部玩法数值可视化配置，群里程碑、结束排行奖励、喂养档位三处 JSON 可改；后端 8 个端点（config / config.save / test_jev / test_broadcast / test_start / test_end / data / clear_data），**Jev Key 一律脱敏返回、绝不回显明文**（前端回填脱敏串时后端识别并跳过，不会把 •••• 写进配置）；清数据会**一并重置 `meta.settled`**，否则清完数据活动仍被标记「已结算」再也发不出奖励；月耀模块导入失败时卡片顶部显式红字提示，不会静默显示一份无效配置。⑦**刻意不提供任何群内管理指令**：本活动无「月耀配置 / 月耀开始 / 月耀结束 / 月耀结算」——活动的开关、双阶段起止时间、全部玩法数值与排行榜/里程碑奖励**只在后台「节日活动」页配置**（改 `phase_*.start_at / end_at` 即开始/结束），结算由后台循环在两阶段 `end_at` 均已过后自动执行一次，群内只保留玩家玩法指令，不给管理员留指令入口。⑧健壮性：`merge_config`/`apply_config` 对 `phase_*`/`daily`/`jev` 等嵌套 dict 改为**一层合并**而非整体替换——否则旧存档少一个 `end_at` 会让它退回 0（=不限）、活动永不结束、结算永不触发。**改了 `petpark/`（新增 moonfest 包、webadmin.py）与 `main.py`，必须整框架冷重启生效。**
  v3.19.2 修复插件高频占用服务器内存与 CPU：py-spy 实测单核 95%（单日 585 分钟）、进程堆 257MB、存档单日写盘 6460 次且每次约 2 秒（15 点后飙到 983 次/小时），三处根因全在保存链路上。①**`_flush()` 每次做 6 遍全量 IO → 3 遍**：原实现序列化→写盘→**读回整档重新 json.loads 做校验**（`json.dumps` 产物必然合法，这一步纯浪费，占单次保存约 1/3 CPU，还要多读 4.5MB）→**读旧档+写备份**（又一整轮读写）→替换。现改为写盘后只比对**字节数**（O(1)，新增 `_verify_written`，截断/磁盘满仍会在 `tmp.replace` 前抛 OSError 保住旧档，`test_failed_validation_preserves_old_save` 已改钉新校验点），备份改**硬链接** `os.link`（零拷贝，`.bak` 持旧 inode 内容与原实现字节等价，文件系统不支持时回退整档复制、复制失败不阻断保存，与旧行为一致）。②**`adventure/service.handle()` 去掉事务内同步 `_flush()`**：每条冒险指令全量落盘是保存风暴主力，而外层三条生产路径本轮结束时本来就会 `await store.save()`（群消息 `main.py:2082`、网页 `web_dispatch`、自动助手 `_assistant_tick:1684`），事务内这次是纯冗余——新增 `test_handle_defers_disk_write_to_caller_save` 固化「handle 只改内存、写盘归外层」的新契约；`test_adventure.py` 四处「handle 后直接重载断言」的用例补了显式 `_flush()`。**风险已评估**：receipt 幂等窗口从「事务内落盘」变为「外层 save 前」，窗口是同一请求内毫秒级，且 QQ 重试本就靠 request_id 收据（收据与数据同一时刻落盘，不会劈叉）。③**回滚快照排除 `audit_log`**：`handle` 原来 `deepcopy` 整份存档做失败回滚，而 `audit_log` 占存档 58%（2.63MB/10585 条）、冒险轴全程不写它（`_audit` 只在 main 调度层、进 handle 之前调用）——快照按排除它构建，回滚时把事务期间的审计现值原样挂回（`_rollback`，绝不回滚审计），单条冒险指令深拷贝量立减过半（profile 里 deepcopy 一项占 35%）。④**顺手修 `audit_cap` 接线 bug**：后台配置 `audit_cap`（`main.py:700`）此前只读进 `self.audit_cap` 从没传给 store，`store._audit` 一直读 `_data["audit_cap"]` 的 20000 兜底——后台改上限**从不生效**；现 `store.__init__` 增 `audit_cap` 属性并在 main 读配置后注入，优先级 `_data["audit_cap"]`（数据层/测试显式指定）> 配置 > 20000，线上无该 _data 键、配置未设 → 走 20000，**零行为变化**（用户已确认审计数据一条不丢，本次不动 20000 上限、不裁剪现有 10585 条）。预期效果：单次保存 ~2s → ~1s 以内，写盘次数砍半以上，堆分配频率与深拷贝量显著下降（存档本体加载才 43MB，257MB 是高频分配 16.6MB 序列化串留下的 glibc 碎片）；**存档 4.55MB 中 audit_log 占 58% 这一事实本次不处理**（用户选择不丢数据、暂不拆分，若日后仍嫌大再单独做拆分方案）。本次**不含保存节流合并**（用户选择本次不做）。Playwright 常驻 chrome 全家约 260MB 是图片渲染设计（每请求冷启曾致 p90 11 秒），不动。零玩法数值改动。**改了 `petpark/` 与 `main.py`，必须整框架冷重启生效。**
  v3.19.1 官网首页改以官方服排行为准（**补漏，非新口径**）：起因是首页「仙途战力榜」第 1 名战力显示成 `4.619215173913044e+129万亿`——那是**无限服**群 `48FCFF0C…` 的玩家（道号「剑修修士」，Lv999 真仙）。无限服免一切税费与限制、小管理员可无上限加灵石/玄晶，再叠上**无累计上限**的重生（全属性 ×2~×10，成本仅 1 万天晶 + 10 万玄晶），属性指数爆炸；`e+129万亿` 本身是前端 `fmtPower` 的 JS Number 精度伪影，存档里是 4.6e129 的整数。①**口径早已存在并已上线，只有首页漏了**：群内「仙途战力榜全服」（`_rank()`）与神榜领奖（`_claim_rank_reward`）一直按群剔除无限服，摸金榜/扫雷榜（`_tomb_rank`/`_tomb_daily_rank`/扫雷榜）一直按 openid 剔除，`docs/指令与产出总览.md` 与知识库 §20.1 均已成文；而公开端点 `GET /api/portal/home`（`petpark/portal.py` 的 `_api_home`）从上线起就没有任何过滤——本次只是把既有口径应用到唯一漏掉的地方。已逐路由核实公开面仅此一处：`/portal` 与 `/chat` 无会话直接跳首页且模板无榜单，`webadmin` 全部要登录且只出列表、不出排序榜。②**两种口径各自的理由**：有 group 的档案类榜（仙途/灵宠）**按群**剔除——无限服玩家的**官方服档案保留**在榜上（数据键 `群\x1fopenid` 本就群间独立，实测 5 个涉事 openid 在官方服都有档案）；摸金三榜按**裸 openid 全局共享**（`store.tomb_state`，实测线上 126 个键全是纯 openid），无法按群归因，只能按 openid 连人一起剔。③**已知局限（无法在门户层修复）**：摸金剔的是**人**不是**数据**——双服玩家在无限服赚的冥币与官方服那份同处一条记录，拆不开，所以他的冥币也一并从官网消失。这与群内 `_tomb_rank` 的既有行为完全一致，已在知识库 §20.1 写明。④**口径下沉到 store（单一来源）**：新增 `store.infinite_group_ids()` / `store.infinite_member_qqs()`，`main._infinite_group_ids/_infinite_member_qqs` 改为一行委托（方法名与签名不变，8 处调用点零改动，`tests/` 无测试盯防这两个名字）。用户级注意：**本次改了 `petpark/` 下文件，必须整框架冷重启；若只热重载 `main.py`，运行中的旧 `PetStore` 类没有这两个方法，会 `AttributeError` 并同时打断神榜、摸金榜、扫雷榜、跨群四条在线路径**。新实现统一为「先 resolve 到规范群、再读**规范群自己**的 server_type」，与 `store._is_infinite_group` 同源；旧写法读的是**原始键**的值，两者仅在 `group_map` 非空（历史别名键）时分歧——实测线上 `group_map` 为空 `{}`，故**委托零线上行为差异**（两种写法产出同一集合、同一批 5 个 openid），此收敛只是消除一份潜在不一致。另加 `isinstance` 字典防御（线上当前无脏条目，纯预防）：4 条摸金/扫雷榜不再可能因单条脏数据整体崩掉。⑤**首页展示**：统计卡「全服玩家」→「官方服玩家」并补「已领灵宠」（原标签「在册宠物」与数字口径不符——数字实为「有出战灵宠的档案数」，现只改标签、数字口径不动）；仙途/灵宠/摸金三榜副标题与页脚补「仅官方服（不含无限服）」；摸金「全服」改「官方服」；今日/昨日摸金榜的副标题是动态串（`{{ todaySub }}`/`{{ ystSub }}`），改的是 JS 初值与 `loadHome` 模板。`stats.auth_groups` **刻意不动**——它统计机器人已授权群数、不是无限服玩家数据，须与后台群管理页一致。零玩法数值改动（不动无限服的任何数值/重生倍率，不动那 5 人存档，不动 `fmtPower`，门户侧只新增过滤）。
  v3.19.0 定制宠物自动助手「修炼/双修」「幻境寻宝」改为**永久免费**，并把定制次数池保底从 5 万收敛到 1000。①免费口径：新增 `data.ASSISTANT_CUSTOM_FREE_TASKS = ("修炼", "幻境寻宝")`，由 `main._assistant_free_task()` 判定——`pet["custom"]` 为真且任务在表内时，执行**不扣次数**、剩余次数为 0 也**不停机**，此为宠物级、**无期限**，与既有两套玩家级限时口径（后台「限时免费」窗口、月卡生效期）彼此独立、可叠加。「修炼」一个 key 同时覆盖双修：已婚宠物的「修炼」任务内部改跑『双修』（`_assistant_cult_action`），故无需单列。②tick 三处判定改造：停机判定（循环开头与本轮末尾各一处）改为「额度为 0 **且勾选里一个免费任务都没有**才停机」，否则定制宠物选着免费任务也会被停机判定吃掉；单任务额度判定由 `break` 改为 `continue`——原来一旦额度见底就整轮退出，会让排在收费任务**后面**的免费任务被连带饿死，现在只跳过付不起的收费任务、免费任务照跑；停机判定同时上移到 `_busy_reason` **之前**，避免一只长期「忙碌」的宠物永远走不到停机分支、顶着 🟢 运行中显示剩余 0 次。③展示与门禁：助手面板新增「🎨 定制宠物免费」行（列出勾选里哪些任务免费），已生效回执/助手状态同步；助手状态逐条任务标注「（定制免费）」，并在额度为 0 时把付不起的收费任务由「可执行」改标「次数不足」（否则会显示一个永远不会跑的 🟢）；`开启自动助手` 的门禁放行「额度 0 但选了免费任务」的定制宠物，非定制宠物仍照旧拦截。④次数池保底 `ASSISTANT_QUOTA_CUSTOM_PET` 由 50000 → **1000**（宠物定制卡文案用常量插值，不再写死）：5 万整池是当年为补偿「定制宠物永久免费」下线而设，现已无必要。新增一次性迁移 `_migrate_custom_quota_v2`（幂等标记 `custom_quota_v2`，迁移前备份 `.pre_custom_quota_migration.bak`）**只向下封顶、不向上提升**——额度本就不高于新值的一律不动（可能是玩家自己用自动助手卡充的），只削掉旧保底溢出的部分；幂等标记是必需的，只靠「取 min」的写法会在玩家日后充回 5 万以上时于下次冷重启吞掉充值。线上现存 5 名定制宠主人次数**恰好都是 50000**（无人叠加充值），收敛后各为 1000。仅助手计费与定制次数池变更，修士轴与其余玩法数值零改动。
  v3.18.3 修复玩家中心「我的灵宠」只列绑定当时那一只：绑定语义自 v3.8.0 起就是「(群, 用户ID) 槽位 = 一位修士」（`account["bound_slots"]`，`bind_pet_to_account` 只是 `bind_slot_to_account` 的别名），但 `portal._api_me` 的灵宠列表仍从账号 `bound_pets` 快照展开——而 `bind_slot_to_account` 只在槽位**尚无**宠物条目时补录一只，故一个槽位最多留一条，修士名下养了 2 只以上时列表恒为 1 只（同一函数里的 `pet_count` 却早已按 `len(player["pets"])` 算真实只数，两处口径打架；绑定页 `_api_bind_auto` 用的也是真实只数，所以只有玩家中心灵宠页是短的）。线上实例：某玩家在群 `0A0B42…` 名下「暴鲤龙」「大钢蛇」两只，灵宠页只出得来一只；快照里存的还是绑定当时的旧名（群 `AE3285…` 记着「Skye」，而该修士名下的宠早已是「k帝」）。现 `_api_me` 改为**按槽位实时展开该修士数据底下的全部宠物**（`player["pets"]` 全量逐只带 `pet_index`/等级/品质/头像，另标 `active` 出战位与槽位级 `active_pet`），响应新增 `pets` 字段、`bound_pets` 保留同值别名以兜住仍开着旧页面的标签页；前端消费者同步改口径：玩家中心初始化与 `refreshAll` 改读 `me.pets`，槽位默认加载的灵宠改为**优先出战宠物**（原先一律取列表首只，多宠时可能默认出现一只没在出战的宠），灵宠选择器给出战宠物加「出战」角标（`.pet-option .name .pet-active`，`portal.css` 缓存戳 bump 到 `?v=20260924-1`）；「网页游玩」页原也吃 `me.bound_pets`，但它只按 `group_id + qq` 提交（`/api/portal/chat` 不吃 `pet_index`），改成逐只宠物后同一槽位会出现多个指向同一会话的重复项，故改为按**角色（槽位 = 一位修士）**建列表（名为修士道号、头像用修士立绘 `adventure.portrait_url`，取不到回退契印），纯修士无宠的槽位同样可选——与 v3.8.0「纯修士玩家亦可绑定」对齐。账号 `bound_pets` 存档结构不动（后台管理页展示、解绑 `unbind_slot`、强制要回 `reclaim_pet_binding` 均按原样工作），无数据迁移、无停机。仅展示口径修正，绑定权限与玩法数值零改动。
  v3.18.2 修复月卡跨档续费「普通 + 旗舰卡 = 旗舰 60 天」的档位溢出：v3.18.0/v3.18.1 把月卡存成单份 `{tier, remaining}`——档位挂在**整段时长**上，于是 `redeem_monthly_card` 里「升档」与「时长相加」两步一合，此前剩余的旧档时长会被一并升级：普通剩 30 天时兑一张旗舰卡即得**旗舰 60 天**；反向更亏（旗舰玩家兑一张便宜的普通卡 → 旗舰权益白拿 60 天）。现改为**按档位分桶计时**（`player["monthly"]["buckets"] = {normal: 秒, flagship: 秒}`）：兑换只往**本卡自己那一档**加 30 天、绝不触碰其它桶；结算**高档优先消耗**（先扣旗舰桶，扣穿后溢出部分再扣普通桶，见 `store._monthly_settle`），生效档位 = 当前有余额的最高档（新增 `store.monthly_tier`）。于是普通剩 30 天 + 旗舰卡 = **旗舰 30 天 → 普通 30 天**（合计仍是 60 天，玩家一分钟不亏），旗舰剩 30 天 + 普通卡 = 旗舰 30 天 → 普通 30 天（普通卡不再延长旗舰权益）；同档续费照旧叠加（旗舰 30 + 旗舰卡 = 旗舰 60），旗舰卡每张仍各兑一次 6000 天晶（与时长无关）。旧存档的单档结构由 `_monthly_norm` 就地迁移为对应桶（原档位 + 原剩余），无需停机。展示层同步改为「当前档位剩余 + 之后 <低档> N 天」两段式文案（助手面板/开机回执/助手状态/我的信息/兑换回执，门户新增 `assistant.monthly.hint` 字段）。仅月卡内部结构与文案变更，助手计费、免费窗口豁免与其余数值零改动。
  v3.18.1 修复后台选「普通月卡/旗舰月卡」后输入框不隐藏：v3.18.0 给 admin.js 加了月卡的隐藏与生成分支，但页面引用的缓存戳还是 `admin.js?v=20260922`，浏览器命中旧缓存 → 切到月卡时灵石/玄晶/天晶/道具/授权天数等面额框照旧显示，点「批量生成」还会走旧分支弹「请填写面额」。现将 admin.js/admin.css 缓存戳 bump 到 `?v=20260924`，引用 URL 变化即强制拉新 JS，选月卡后只需填「数量/前缀」，面额与授权框全部自动隐藏。
  v3.18.0 新增「普通月卡 / 旗舰月卡」两种卡密（后台卡密页可批量生成，玩家群内 `兑换 卡密` 使用）：**普通月卡** = 30 天内自动助手执行任务**不扣次数**（次数余额原样保留，0 也能跑；与全服「限时免费」窗口重叠的时间**不消耗月卡时长**）；**旗舰月卡** = 普通月卡全部权益 + **兑换立即到账 6000 天晶** + 生效期内**每次签到额外 +300 天晶**。月卡为玩家级（`player["monthly"]`，惰性结算 `store._monthly_settle`，免费窗口按区间重叠秒数豁免计费），重复兑换**时长叠加、档位只升不降**（旗舰玩家兑普通卡只加时长不降档）。接入点：助手 tick 三处停机/扣次判定与群内/门户开机门禁均按「免费窗口 ∪ 月卡生效」放行，助手面板/助手状态/开机回执/门户玩家中心/我的信息均展示月卡生效状态与剩余天数；`redeem_card` 加防呆（月卡误走通用兑换会明确报错）。纯新增，不改任何既有数值与免费窗口逻辑。
  v3.17.0 新增顶级品质「超脱」与定制宠全面晋升：①品质表第 11 档「超脱」（成长系数 11.0，高于混沌 9.2），**刻意不进砸蛋/随机权重表**——砸蛋、宠物卡召唤、炼化宠物卡等一切随机取品质渠道均不出超脱，普通玩家唯一途径是 `合成卡 超脱卡`（**30 张混沌卡**合成 1 张，合成链保持 创世→混沌 20 张、其余 10:1）；超脱无碎片、市场禁售、炼化超脱宠按混沌档折算产出（封死回收绕道）。②宠物定制卡解锁路径（群内使用/卡密兑换/后台解锁三处）晋升品质由混沌改为**超脱**，全服贺电与玩家中心文案同步。③所有已有定制宠物经一次性迁移（`custom_quality_v1` 幂等标记，迁移前自动备份 `.pre_custom_quality_migration.bak`）提升至超脱品质、属性按 11.0/9.2 比例同步飞跃；名下持定制宠的玩家自动助手次数池**保底提升至 5 万**（只升不降），此后新解锁定制同样保底 5 万（新增 `ASSISTANT_QUOTA_CUSTOM_PET` 与 `raise_custom_assistant_quota`）。纯玩法扩展，不动修士轴与既有数值。
  v3.16.1 管理端国风换肤（对齐 bot.flyyye.cn 首页视觉）：登录页与管理后台从蓝紫渐变风改为「墨绿/宣纸/描金/朱砂 + 楷体 + 契印」国风体系——登录页用山海首图作背景、宣纸卡片、朱砂「契」印与「验印入仙途」标题；后台页头改墨绿底 + 契印 + 描金分隔线，标签页/按钮/表格/弹窗/统计卡全部套用首页同套色板与直角圆角语言，JS 内联面板样式与状态标签色同步替换（蓝 #2f6bff→青 #286356、紫 #6d4aff→墨绿系、警示红/绿/橙同步收进国风色板），仅视觉改版、接口与交互逻辑零改动。
  v3.16.0 数据追溯/异常检测「三件套」上线：①**append-only 操作审计流水**——玩家指令与资源变动（转让/购买/签到/卡密兑换/宠物获取/管理员增减/封号解封/抽奖领奖）全部落账，每条带 SHA-256 哈希链锚定（prev 指向上一条的哈希，任一条被篡改即断链），后台可一键「校验哈希链」；流水有界环形（默认保留 20000 条，超限丢最旧），全量记录靠 `audit_cap` 控体积、`audit_enabled` 可随时关闭（关闭不落任何日志，已存数据保留）。②**规则+基线异常自动检测**——实时轻量规则在每条流水落账时 O(1) 判定「单次资源变动超限」（默认 10 亿 → high），后台「全量扫描」再跑五条规则：单次超限/1 分钟指令频率爆表（默认 60 → mid）/日净流入超历史日均 10 倍且 ≥1 亿（high）/新号 24h 累计超 1 亿（mid）/7 天同人转让超 50 次（mid）；命中落异常标记表（类型/严重度/描述/状态），同规则同目标只留一条待处理，可人工标「已处理/误报」。③**后台「数据追溯」标签页**——上半流水查询表（时间/群/用户/动作/详情/变动前后值与差值 + 动作/群/用户ID/时间范围/关键字筛选 + 分页），下半异常标记表 +「扫描」「校验哈希链」按钮；另新增群内大管理员指令 `审计检查` 可查本群待处理标记。新增 8 个后台配置（`audit_enabled`/`audit_cap`/`audit_rule_big_single`/`audit_rule_cmd_rate`/`audit_rule_baseline_mult`/`audit_rule_daily_floor`/`audit_rule_newbie`/`audit_rule_friend_tx`）。纯观测+后台工具+一个查询指令，不拦截任何正常玩家行为，不改任何玩法数值。
  v3.15.0 QQ 群强制同意用户协议：与「强制绑定QQ」同原理的拦截——未同意用户协议的玩家发任何游玩指令（含中元）都被拦下，回复协议地址 https://bot.flyyye.cn/agreement 并附一个「同意」按钮；按钮用官方回调按钮（action type=1 / INTERACTION_CREATE），点击**不在群里冒出用户消息**，且用官方 type=0 指定用户（specify_user_ids=点击者 openid），只有本人能点、别人点客户端在源头拦住、事件不推给机器人；服务端另按载荷 `同意协议 #<openid>` 兜底比对，非本人静默丢弃不弹提醒（与自动助手面板同一套处理）。同意状态存 `agreement_consents`（平台用户ID → 协议版本，跨群通用），版本号对齐协议生效日期，协议改版时改 `AGREEMENT_VERSION` 即让旧同意全部失效、全量重新确认。拦截放在「已知指令过滤」之后：普通聊天仍静默放行，不刷屏；菜单/帮助/绑定相关指令与「同意协议」本身不受拦截；大管理员（配置白名单）豁免，免得运营者被自己的协议锁在管理功能之外。新增后台开关 `require_agreement`（默认开，可随时关闭恢复不强制）。
  v3.14.0 官网新增「用户协议」页：首页页脚新增「用户协议」入口按钮（链接 /agreement），新页复用国风首页同套视觉（卷轴山景题图、契印标识、楷体标题），正文为手写式中文条款，共九节：总则、账号与绑定（群号+用户ID、玩家中心 bot.flyyye.cn 绑定）、玩法与虚拟资源（四职业/灵宠/坐骑/道侣/宗门/洞天/秘境/摸金/深渊，灵石/玄晶/天晶为虚拟货币无现金价值、卡密即时到账）、行为规范（禁刷屏辱骂多开小号利用漏洞；明确禁止利用游戏漏洞违规刷资源，处置=撤回/封号[可设天数或永久]/清档/回溯违规用户数据/移群，一切处罚解释权归开发者）、数据与隐私（服务器存档、可申请清空本群数据）、未成年人保护、免责声明（维护暂停/第三方渠道/不可抗力）、协议变更（官网与群公告公示）、生效与解释（生效日期 2026-09-22，协议解释权归开发者）。该页为纯静态 HTML，不依赖 Vue/Element Plus，与首页同套主题色（--ink/--paper/--gold/--red），移动端自适应。
  v3.13.2 修复自动助手「给 A 宠挂机、任务却落到 B 宠身上」（表现为修炼莫名报『此灵宠已飞升』或『需与道侣缔结婚约』，同一只宠同一分钟内跑出互斥结论）：助手靠临时把 `player["pet"]` 指向被代跑的宠物来实现「按宠物隔离」（勾选与冷却都按宠物存），但**冒险轴的成功路径是同步调 `store._flush()` 的**（`petpark/adventure/service.py`），而 `_flush()` 的 `finally` 会按 `active_pet` 重建**所有**玩家的 `player["pet"]`——于是「修士修炼/修士突破/外出历练」只要排在任务列表前面并真的跑成功，引用就在这一轮中途被冲回出战宠，其后同轮的「修炼/双修/打工/洗髓/家园收取…」全部落到出战宠身上：出战宠是飞升宠就报已飞升、未婚就报需缔结婚约，冷却与精力也一并记到它头上。现 `_flush()` 改为**弹出时记住原对象、序列化完原样放回**（不再按 `active_pet` 重建），并在助手每个任务执行前重新钉一次引用兜底。线上实证：某玩家 `pets[0]`（幼年期、已婚、开了助手）21:05–21:09 三次「修炼」分别得到「需缔结婚约 / 双修 +714 成功 / 此灵宠已飞升」，而 `active_pet` 当时指向 `pets[1]`（渡劫）——成败只取决于同轮「修士修炼」是否因冷却被跳过（跳过则无 `_flush()`、引用未被冲掉，任务才跑对）。仅修运行时引用恢复的语义，存档格式与玩法数值不变。顺带说明：v3.13.1 那条「只作用于出战位」的成因判断不准确，实测是被本缺陷冲掉引用所致，其点名灵宠与切换引导文案本身仍有用（手打指令确实作用于出战位）。 v3.13.1 「修炼/双修」被拒时文案点名**具体是哪只灵宠**：多宠玩家看到「此灵宠已飞升」时常误以为是自己刚重生的那只被判了飞升（重生像失效了），实际执行的是另一只。现拒绝文案带上灵宠名字，并在玩家名下还有未飞升灵宠时补一行引导「💡 当前出战位是它；你名下还有 N『名字』未飞升，发送『切换宠物 序号』切换后即可修炼」。仅改提示文案与引导，判定逻辑与玩法不变。
  v3.13.0 扣精力指令回执统一补「精力消耗」：全仓库 17 处真扣精力，此前仅 4 处（宠物改名/觉醒/制符炼丹/精力转移）在回执里说明消耗，其余 13 处——尤其最高频的 10 个日常动作（约会/修炼双修/打工/闭关/学习/玩耍/洗髓/冥想/探险）与进入副本/挑战神仙/深渊秘境/活动副本/活动Boss/摸金入场/家园收取/宠物攻击/跨群攻击——扣了却只字不提，玩家无从感知每次操作烧了多少精力。现新增 `_energy_note` 统一在每处扣减点回执末尾追加一行「🔋 精力 -X（剩 Y/Z）」（扣减 + 余额），余额取扣减后真实值（深渊秘境为精力回收返还后的余额，与 ♻️ 返还行共存可算净消耗）；家园收取按派遣宠累加，摸金只给主摸金者显示、队友侧记为已知遗留。
  v3.9.5 修士气血（当前血量）实装：战斗后气血跨战斗保留并落档，修士卡/文字版「我的修士」/玩家中心均显示 当前气血/上限（此前只有血量上限，看不出战损）；存活每分钟自动回复上限1%，气血归零=陨落（拦截一切出战指令），静养30分钟自愈至30%上限；道具商城新增『回血丹』（400灵石，立即回复50%上限）与『复苏丹』（1000灵石，陨落后立即复活并回复50%）；切磋保持无损不落档。 v3.9.8 修复定制坐骑价值/奖励渲染回归：v3.9.5 曾删除 _mount_value/_mount_reward_range、渲染只读官方 MOUNTS，导致不在 MOUNTS 的定制坐骑「价值/奖励」恒显示 0、入场也不发玄晶；现恢复「实例>官方配置」取值，定制坐骑价值缺省 2 亿、奖励缺省 20万~30万，定制坐骑入场奖励与点击图正确生成。 v3.9.9 坐骑入场/离开卡补底框成对词：坐骑文字信息卡（入场/离开）顶部已有主题词（入场=闪★亮、离开=绝★尘），现按用户要求补一个底部成对词框，与顶部构成上下对称语感——入场「闪★亮/出★行」、离开「绝★尘/而★去」；「我的坐骑」及非入场/离开场景不显示底框，保持原样。 v3.10.0 新增独立招新自动审批模块（脱离宠物乐园，状态独立存 recruitment.json）：群内最大管理员用「开1/关1」开关（默认关闭、不需授权），开启后自动通过入群申请并推送欢迎文案；同时强制关闭宠物乐园旧的全量自动审批与旧版入群欢迎，避免绕过审核与重复推送。 v3.10.1 招新模块定稿：审批轮询改为每 10 秒一次且不再调用 AI（符合条件直接通过）；欢迎语改用定稿文案，并在「欢迎」之后带上申请时填写的答案信息（取 verify_info 的问答答案，缺省退回验证消息）。 v3.10.2 招新审批提速与退群重进修复：轮询间隔 10 秒→5 秒；此前「已欢迎」标记是永久去重，导致退群后重新申请进群不再推送欢迎语，现改为收到新的入群申请即清除该成员的欢迎标记与答案缓存（同时接上群成员退出事件主动清除），退群重进可再次收到欢迎。 v3.10.3 欢迎语排版调整：申请答案不再另起一行挂在底部，改为直接嵌在「🎉热烈欢迎」之后（如「🎉热烈欢迎 计算机2201班 张三 加入信飞工作室招新群！」），其余文案不变；取不到答案时退回昵称，仍取不到则不加。 v3.10.4 关闭宠物乐园旧版退群提醒：此前成员退群会推送「👋 成员退群 成员 @… 已离开本群。」，现硬关 `leave_push`（配置里即使为 true 也不发），退群事件只用于招新模块清除欢迎标记，不再对外发消息。 v3.10.5 招新群彻底静默游戏：群内 `开1` 开启招新后，该群宠物乐园（灵契仙途）全部指令不再响应，框架在本群只放行招新模块；`关1` 在判定之前处理，关闭后本群立即恢复游戏。 v3.10.6 欢迎语改用 QQ 官方 Markdown 排版：标题 `## 🎉 热烈欢迎 <申请答案> 加入信飞工作室招新群！`，「班级 + 姓名」加粗强调，段间统一空行避免单换行被 Markdown 吞掉，末尾用 `━━━` 分隔线 + `>` 引用承载「（上方消息由QQ官方赞助支持）」落款。 v3.10.7 欢迎语回退纯文本：按用户要求去掉 `##` 标题、`**` 加粗、`━━━` 分隔线与 `>` 引用落款，恢复 v3.10.5 的纯文本外观（答案仍嵌在「热烈欢迎」之后）；唯一保留的差异是段间改用空行，避免单换行被 QQ Markdown 吞成一段。 v3.10.8 修复人多时欢迎语静默不发：入群欢迎改为「待发队列 + 错峰发送 + 失败重试」，`on_member_add` 只入队（满队列时快节拍 1.5 秒发一条，空闲回到 5 秒审批节拍），且**只有真正发送成功才标记已欢迎**——此前是先标记再发送，一旦发送失败该成员就永久收不到欢迎且无日志；现失败最多重试 5 次、超限告警并不标记，退群同时清掉待发队列；`send_group` 改为返回布尔成功态；成员加入/跳过/去重/入队全程留日志，便于排查为何不发。 v3.10.9 修复申请答案含换行导致欢迎语标题被劈开：申请人可在输入框内换行（线上真实出现「工软262\n侯文慧」），答案直接内嵌会把标题断成两行，现渲染前把答案中的连续空白（含换行）压成单个空格，纯空白答案退回无答案样式。 v3.10.10 招新审批链路可诊断 + 欢迎不再只依赖入群事件：此前 `tick()` 内除审批外全程静默（查询失败被裸 except 吞掉、角色不足/查到几条申请/审批结果都不留痕），线上出现「有人进群但欢迎没发」时只能靠猜；现每轮记录「机器人角色、申请条数、审批通过/已被其他管理员处理」，攒齐一轮只在有变化时输出一行，稳定后每分钟一次心跳（启用群数/待发条数/已欢迎人数）。同时欢迎改为双触发：入群事件照旧入队，**我们自己审批通过的人直接入队**（延迟 3 秒，等人真正落地），不再单靠实测不保证送达的 `group_member_add` 事件；待发项新增 `due` 时间戳（旧状态文件无此字段按立即发送兼容）。 v3.10.11 炼化宠物卡支持批量：`炼化宠物 宠物卡 [张数|全部]` 一次炼化多张，免去一张一张发指令；实际张数取「想要 / 背包持有 / 玄晶够付」三者最小值，所以「全部」是在钱包允许范围内全炼掉、不会把玄晶扣成负数，被卡住时明确告知原因（背包只有 N 张 / 玄晶只够 N 张）；多张输出按品质汇总成表（品质卡/碎片分列 + 合计），单张沿用原文案、老玩家观感不变。 v3.10.14 新增「修士侦查 用户ID」：与「我的修士」同一出图口径查看本群他人的修士卡（只读、同样受银行逾期拦截，渲染失败回退文字版）；并修复活动奖励显示名未随修士化改名——奖池表/活动商店与抽奖池/领奖回执/伤害榜「获得奖励」列/奖励历史里仍显示旧币种名「钻石」，现统一显示「天晶」（金币/积分同理映射为灵石/玄晶，物品名与活动代币原样不动）；写库、扣费与每日上限仍走原始键，存档零迁移。 v3.10.15 修士战力折算定稿（防「宠物氪金碾压排行」）：灵宠项由「实战战力全额计入」改为 **实战战力×15%**，坐骑项由 projection 估算法改为 **坐骑实战增量×10%**（旧算法漏掉成长曲线与神通/灵根乘区，实测低估 18.7 倍，power 335300 的坐骑算成 76、真实增量 1419），另设「灵宠项 ≤ 本体×0.5」兜底封顶。防霸榜实际靠结构而非封顶——灵宠实战战力按修士等级缩放，修士没练的玩家宠物项自动就小，再叠 15% 折算后宠物项稳定只占本体 7%~24%，排行仍由本体主导（本体占比由 52% 升至 88%）；氪金养的宠在同等本体下照拿满额，保住氪金优待。修士卡/文字版/官网同步展示折算系数与折算前原值，公式透明可核。 v3.10.16 灵宠折算率改为随修士等级爬升：固定 15% 改为动态 r(L)，修士 Lv1 → 0%、Lv999 → 15%（线性）。灵宠实战战力同步与修士等级解耦，改按「满级修士」口径计算——此前 companion_sheet 的 pg 等级缩放已让宠物战力随修士等级变，再叠一层折算率就是两层相乘、低等级被压两次；现只保留 r(L) 这一层（companion_sheet 的 pg 是战斗在用的，绝不动）。满级玩家数值不变，低等级小幅下降（Lv186 约 -8%），无断崖。修士卡/文字版「我的修士」/官网同步显示当前折算率与满级参照。 v3.10.17 灵宠项去掉「本体×0.5」上限：灵宠战力贡献 = 灵宠实战战力 × r(修士等级) 纯乘、不再封顶，防霸榜全交给等级门槛。该保险丝实测从未触发（全服灵宠项/本体最高 18.27%，远低于 50%），故数值零变化，仅公式与三处卡面文案简化。 v3.10.18 去除 log2 压缩：`combat.projection` 由 `weight×log2(1+原值/基准)` 改为线性 `weight×原值/基准`，灵宠与坐骑的原始属性按原值等比计入，不再在对数尾部被压平（此前面板涨 5866 万倍只换 3.4 倍，养成投入被吃掉）。projection 只作用于灵宠属性面 `companion_sheet` 与坐骑攻击加成 `hero_sheet`，修士本体主属性线与敌方强度不受影响。⚠️ 灵宠原始属性当前无上限，去压缩后高养成灵宠线性兑现，实测全服 30 人中 3 名「喂满宠」玩家显著跃升（钢龙 Lv241 灵宠项 8,036→1,208,192 亿，本体占总战力 76.9%→0.000%），中位玩家几乎不变（98.2%→98.1%）。回退只需把 projection 还原 log2 或改幂曲线（指数 0.25 时钢龙灵宠项 16.15 万、本体占 19.5%）。 v3.10.19 装备词条加成上修士卡：此前「修士装备」只显示词条名（如「破军」），玩家无从知道它到底加什么——词条是进阶成功时八选一的百分比乘区（破军攻+6%／御守防+6%／气血血+6%／疾风速+6%／混元全属性各+2%／锐金攻+4%防+2%／木华血+4%速+2%／水火攻+3%血+3%），与神通、灵根同一通道叠加，却只在 hero_sheet 里生效、卡面与面板都看不见。现修士卡每件装备格底部新增一行词条（琥珀金加粗＋金色虚线上分隔）：已觉醒显示「破军 攻+6%」，未觉醒显示灰色「未觉醒词条」（兼作进阶引导）。该行顶替原「提升X」——装备名与属性面板已表达加什么属性，而词条加成本来无处可查。四项同值的混元显示为「全属性+2%」而非罗列四项。装备格可用宽度仅 110px，最长的双属性词条串实测 101px，故不加任何前缀图标以保证单行不折行。八种词条形态已纳入修士卡预览工具与溢出断言。 v3.10.20 修复宗门兑换↔捐献自增殖漏洞（聚灵丹泛滥的根因）：灵石袋原为「50 帮贡→3000 灵石」，而捐献回本线是「10 灵石=1 帮贡」，等价于 50 帮贡→300 帮贡、闭环净赚 6 倍，且宗门兑换自上线起就没有任何每日上限（DAILY_LIMITS 只覆盖任务/镇守/探索），线上被单人刷到 1e25 帮贡，再经玄晶袋兑成玄晶、在商城批量购入聚灵丹（单人 2700 万颗）。现灵石袋发放降至 300 灵石（回本 30 帮贡 < 成本 50，闭环收益 0.6 倍、恒亏），并给宗门兑换加「每日 20 件」上限——按件数而非指令次数计，否则一次 `宗门兑换 灵石袋 999999` 即绕过；兑换发放量改由目录条目的 currency/amount 驱动，不再在发放分支里重写字面量，避免显示与实发漂移（本次改动即踩到这个坑：目录改成 300 而发放仍是硬编码 3000）。 v3.10.21 星辰阁加闸（堵住拿公共库存自肥）：星辰阁合成消耗的是宗门**共享库存（treasury）**帮贡，此前却对全宗任何成员开放，等于谁都能拿公共池给自己买东西（星盘大阵=修为翻倍 3 天、灵材×50）；现改为**仅帮主/长老**可动用，并新增按人计的每日 3 次上限——原有的 300 秒/人冷却只管单人连点，挡不住帮里多个长老各按各的冷却轮着取用同一个库存，故必须再有一道按人计的每日闸。同时把合成表收进 `STAR_ITEMS`（成本/描述/发放量单点定义，不再在分支里重写字面量），无参数时返回帮助并列出可合成物、成本与每日上限；成功回执补上消耗的库存帮贡与今日剩余次数，「宗门帮助」里星辰阁一行同步补注「仅帮主/长老，消耗宗门共享库存」。 v3.10.21 大管理员新增「加次数」（给指定玩家追加当天的转让/赠送次数）：每日转让/赠送上限 10 次，此前没有任何运营侧放宽手段，玩家刷满只能等到明天；现大管理员可发 `加次数 用户ID|@对方 数量`（别名 `加转让次数`/`加赠送次数`）为**指定玩家**追加**当天**的次数上限，回执显示「今日上限 X → Y（今日已用 N 次，还可 M 次）」并注明次日自动恢复。额度写在对方当日的 `_tx_daily.bonus` 里：跨日 `_tx_daily` 整体换新 → 次日自动失效，无需清理任务；只影响被指定的那一个玩家，其余人上限仍是 10。计数上限统一走新的 `_tx_daily_cap()`（基础 10 + 当日追加），次数用尽时的提示会带上「含管理员今日追加 N 次」以免玩家以为还是 10 次。仅大管理员可用（小管理员无权），单次追加上限 100 次，且只放宽次数、不放宽税率/单次上限/自转拦截等其它规则。 v3.10.22 大管理员新增「加道具 / 减道具」（增减指定玩家背包道具）：此前运营想给玩家补发或回收道具只能手改 petpark.json，没有任何指令入口。用法 `加道具 用户ID|@对方 道具名 数量`，数量不设上限但须为正整数；减道具时对方数量不足则报错并**原样不扣**——不做「有多少扣多少」，避免管理员以为清空了、实际只扣到 0，事后对不上账。道具名校验走「使用」同一口径：先查 data.ITEMS，再兜活动道具（活动道具不在静态表里，线上如「桂花酿」有 40 人持有）；减道具额外放行「对方背包里真有」的下线遗留道具，好让运营清理历史残留，而加道具不得凭空造出不存在的道具。回执显示该道具的变动前后数量，归零即删键不留 0 值。 v3.10.23 大管理员新增「封号 / 解封 / 封号状态」（本群封号，被封用户所有指令不可用）：此前群里出现刷屏、捣乱、多开小号套物资时，运营只能踢人，没有任何群内封禁手段。现大管理员可发 `封号 用户ID|@对方` 在本群封禁某用户、`解封 用户ID` 解除、`封号状态 [用户ID]` 查单人或不带ID列出本群全部封号（别名 `封号列表`）。闸门放在「已知指令过滤」之后——**普通聊天仍静默放行**（返回 None、不回复），否则对方在群里随便说句话都会被顶一条封号提示，等于刷屏；但只要是真指令就一律拦下，点歌、清空数据、加金币、乃至小管理员自己的加币指令无一例外，口令抽奖因排在过滤之前另单独拦了一次。封号只作用于本群（名单存在群档案的 `banned` 里，与 `subadmins` 同构），换个群照常游玩；且**不要求对方已在本群参与过**——要封的多半正是刷完就跑、或还没落档就来捣乱的人，先要求他注册才肯封等于留了个绕过的口子。收礼同步封死：物品/货币/宠物/坐骑四条转让路径都汇到 `_check_transfer_limit`，在那里按**收方**拦一道「对方已被封号，无法接收转让/赠送」，并刻意排在大管理员豁免与无限服豁免**之前**——豁免的是发方的税与次数，不该顺带把「收方能不能收」也放开，否则大管理员一转、或换个无限服，就等于替被封用户留了后门。**大管理员不可被封**（封号指令直接拒绝并提示改从后台 admins 配置移除），避免管理员之间互相锁死；闸门另对大管理员整体豁免，兜住「先被封、后晋升」的人被自己的旧记录锁在门外。判定「某ID是否为大管理员」统一走新增的 `_is_admin_id()`（含绑定QQ号兜底反查），原 `_is_admin()` 改为调用它，行为不变。 v3.10.24 封号支持「天数」与「永久」：v3.10.23 的封号只有永久一种，运营想惩戒三天还得手动记着解封。现`封号 用户ID|@对方 [天数]`——**不填天数即永久**，填了就封 N 天；另加显式别名 `永久封号 用户ID`（与不填天数等价），已注册进 KNOWN_COMMANDS 与 WEB_BLOCKED_COMMANDS。存档形态由 list 改为 **{用户ID: 到期时间戳}**（永久记 0），到期判断放在读取时（与「加次数」当日额度同一思路），**不需要任何清理任务**；同时兼容旧 list 形态（一律视为永久），且所有写路径都经 `_ban_store()` 规范化 + 顺手清掉已到期条目，名单不会越积越多。重封语义：**按新天数重新计时**（覆盖而非叠加，所以 `封号 x 7` 后再 `封号 x 30` 是剩 30 天；也能用它缩短），但**永久封号不被有限天数降格**——否则一次手滑就把永久封悄悄解成了限期，此时明确回执提示「先解封再重新封」。天数参数写错（0 / 负数 / `abc` / `3.5`）一律报用法错误而不是静默当成永久，避免「本想封 3 天、结果封到天荒地老」；`永久封号` 额外不接受天数参数。回执与 `封号状态` 都带上剩余时间（`3 天 5 小时` / `30 分钟` / `永久`），名单表加「剩余」列；被封用户自己收到的提示也带上「剩余 X」，否则他只能反复试指令来猜还要等多久。解封与转让拦截（`_check_transfer_limit` 按收方拦）、群管理指令闸门（`_staff_cmd_blocked`）、口令抽奖闸门均已随之按「生效中」判断——到期的封号自动失效，无需人工介入。 v3.10.25 大管理员新增「违规词管理（加 / 减 / 查看）」（本群命中即撤回该成员消息）：群里骂战、刷屏脏话此前只能靠管理员盯屏手动撤回。现大管理员可发 `加违规词 死 滚 傻逼`（一次可加多个，空格分隔）、`减违规词 滚`（移除）、`违规词`（列出本群全部）、`违规词 死`（查某个词在不在），词表按群存在群档案 `badwords` 里（与 `subadmins`/`banned` 同构），别的群不受影响。匹配是**子串**而非分词——设置「死」时「你去死」也命中，一个字的词照样触发（需求原话）；匹配前统一去掉全部空白并转小写，故「去 死」这类拆字写法和英文大小写变体一并命中。命中处置按发送者身份分流：**群成员（含群身份取不到时）→ 撤回该条消息**并 @ 对方发一条「含违规内容，已撤回」；**群主/管理员 → 只发提醒不撤回**；**大管理员 → 整体豁免**——否则「加违规词 死」这条指令自己就含违规词、会被自己的规则撤回，词根本加不进去；豁免看的是身份而非「内容像不像指令」，同一句话普通成员发照样撤回。回执里刻意**不写命中的是哪个词**（写了等于公开词表，玩家照着绕），命中词只落日志供运营回头调词表。检测为**即时检查 + 后台每 10 秒兜底重扫**：群消息一到就查（QQ 撤回窗口只有 2 分钟，越早越好），同时把每条群消息截断后记进每群上限 100 条的缓冲，由 10 秒轮询重扫——兜的是即时检查**必然漏掉**的两类：① 消息发出**之后**才把某个词加进词表（即时检查当时词表里还没有它）；② 即时检查半路抛异常被外层 except 吞掉（那条消息就再没人管了）。两条路靠 `_badword_done`（按群记已处置消息ID，随手清掉滑出缓冲的）去重，同一条不会撤两次。撤回失败（超 2 分钟窗口／机器人不是群管理员）自动退化成提醒，不让违规者以为没被罚。词表写入有界：单词上限 30 字（太长会误伤整段话）、每群上限 100 条（匹配跑在每条群消息上），超限明确报错而非静默丢弃；移除不存在的词、重复添加也各有明确回执。（另：本次顺带修复 `metadata.yaml` 第 15 行的历史问题——该行原本没有 key、直接顶着正文，使整个文件不是合法 YAML，框架 `core/plugin.py` 的 `list_plugins` 解析时抛异常并被 `except` 静默吞掉，插件列表里的插件名与版本号一直退化成目录名 + 空；现改写为合法的 `changelog: |-` 块标量。） v3.10.26 「进入副本 / 挑战神仙」支持省略参数、自动打当前等级可进的最高档：此前不带名称只会回一句用法提示（「用法：进入副本 副本名称」/「用法：挑战神仙 等级」），玩家得先发 `宠物副本` 翻列表、自己数到最高档再抄一遍名字。现直接发 `进入副本` 即自动选中「等级门槛 ≤ 当前宠物等级」里**最高**的那一档（20 级 → 魔之森林，120 级 → 烈焰魔窟），`挑战神仙` 同理在 120~220 中自动选最高可进档；带参数的旧用法与文案完全不变。选档按 `level_req` 显式取 max，不依赖配置字典的书写顺序；连最低门槛（Lv10 / Lv120）都没到则明确回「还没有达到任何副本的等级门槛（最低 Lv10）」并引导去发 `宠物副本` 看列表，而不是替他挑一个必败的副本。副本列表与飞升副本列表底部、`帮助` 的历练征伐段、AI 路由指令表均补注该用法。 v3.11.0 「自动修炼」升级为「自动助手」（次数卡制，按宠物勾选最多 4 个任务后台代跑）：旧版挂机只会在「已飞升→幻境寻宝」「未飞升→双修/修炼」之间二选一，其余 16 个日常玩法都得手打；现支持 修炼（已婚自动转双修）/进入副本/挑战神仙/外出历练/秋冬Boss/深渊秘境/宠物神仙劫/砸蛋/砸蛋十连/打工/学习/洗髓/探险/冥想/幻境寻宝/家园收取/约会/修士修炼/修士突破 共 19 项，群内发 `自动助手` 弹按钮面板勾选（每行 4 个、共 5 行，正好卡在 QQ 官方 5 行上限内），点「确定生效」落档，后台每 30 秒按勾选顺序把「冷却已好且资源够」的任务跑一遍，结果静默写入宠物日志（`助手状态` 可查最近 20 条），不在群里刷屏。计费从「按天无限挂机」改为「按次」：1 张自动助手卡 = 500 次，每成功执行 1 个任务扣 1 次，次数归零自动停机；额度是玩家级（同群所有宠物共享一个池），勾选是宠物级（每只宠物独立一套，最多 4 个）。配套清理：删除全部 85 张旧「自动修炼卡」卡密，152 个玩家身上残留的旧 `auto_cultivation` 记录（其中 18 个还有未过期的权限时间、7 只宠物正在挂机）一律清零、不补偿（迁移前自动备份 petpark.json 为 .pre_assistant_migration.bak），定制宠物不再是永久免费旁路；「自动修炼卡」道具（含功德商店 200 功德档、生辰抽奖库存 94 张）改名为「自动助手卡」——**是改名不是删除**，抽奖库存与背包里的旧名条目保留数量跟随改名。按钮改用 QQ 官方 `action.type=1` 回调按钮，点击只在服务端产生互动事件、不再往群里发一条「@机器人 助手选 N」的玩家消息（需框架开启 interaction intent 1<<26 并实现 `on_interaction_create`；官方 schema 里 `enter` 是指令按钮专用，回调按钮必须不带，故 `_build_qq_keyboard` 按 action_type 分流构造）。面板每次点击仍会重发一条（QQ 无消息编辑能力，且互动事件的 `PUT /interactions/{id}` 响应体只能带 code）；互动事件不带 `member_role`，合成事件的 sender_role 为空，所以只有助手面板改用回调按钮，其余既有按钮保持指令按钮不动。门户（bot.flyyye.cn）的自动修炼开关改为「看剩余次数」并对所有宠物开放（原先只有定制/飞升宠物能看见），未勾选任务时明确拒绝开启并引导回群里勾选；顺带修复门户卡密兑换的成功判定——此前用「兑换成功」四字匹配，而助手卡的成功文案是「自动助手卡使用成功」，导致成功兑换却报 ok:false。旧指令 `自动修炼`/`开启自动修炼`/`关闭自动修炼`/`自动修炼状态`/`修炼状态`/`修炼卡` 全部保留为隐藏别名，玩家肌肉记忆不受影响。 v3.11.1 助手面板按钮改光标签（玩家反馈「不要有表情前面，文字显示全」）：真机实测 QQ 对按钮 label 卡约 6 字节，超出即被截成「首字 + ...」（神仙劫→神...、家园收取→家...，而 2 个汉字的 砸蛋/打工/学习 完整显示）；按钮右侧大片留白说明卡的是**字节数**而非宽度，减少每行按钮数救不了。故把 19 个任务标签统一压到 2 个字（修炼/副本/神仙/历练/活动/深渊/仙劫/砸蛋/十连/打工/学习/洗髓/探险/冥想/寻宝/家园/约会/修士/突破），「确定生效」压成「确定」，并去掉 ✅/⬜ 前缀（⬜砸蛋 = 9 字节必被截）。勾选态改由面板正文加粗的「已选 N/4：…」一行呈现（那里用完整任务名，无长度限制），正文并注明「按钮上是简称，完整任务名以已选与助手状态为准」；「助手状态」页仍用完整 key 显示任务名，不受影响。 v3.11.2 助手面板两处体验修复（玩家反馈）：①「已生效」/「助手状态」这类**结果类回复**底下改挂**单个入口按钮**——已勾选显示「修改」（回去重挑那 4 个任务）、未勾选显示「选择」（提醒去勾选），不再整块贴 20 个按钮（玩家会误以为那是本次结果的可选项，既冗余又容易误点）；「自动助手」/「助手选」/「助手清空」这些**面板本身**的指令仍出完整 19+1 按钮。②助手面板按钮改为**绑定主人**：回调按钮是群里任何人都能点的，此前别人点你的面板会弹出**他自己的**面板并操作他自己的助手，从旁看像在改别人的配置；现在按钮载荷尾带 `#<openid>`（面板主人），分发时核对点击者，非本人点击直接回「这不是你的助手面板」并引导发送『自动助手』开自己的面板，既不弹面板也不改动任何人的待选态/宠物配置。手打指令不带该标记，照常可用。 v3.11.3 助手状态两处显示修复（玩家反馈）：① 每个任务的档位原因不再只写「冷却中」，一律带上**具体剩余时间**（`打工冷却中（剩 12分30秒）`、`砸蛋冷却中（单发/十连共用，剩 1分30秒）`），否则玩家无法判断还要等多久、该不该继续挂机；格式化复用既有的 `_fmt_duration`（分/秒，全玩法冷却最长 30 分钟，无需小时位）。修士轴两处特殊文案：『修士修炼』是修为还在积累而非冷却，写「修为积累中（还需 42秒）」；秋冬Boss 处于复活窗口时写「『X』正在复活（剩 …）」。② 「最近执行」不再截断，存**完整结果正文**：此前每轮只存「首行前 60 字」（_assistant_brief），而实战报是 5~16 行（外出历练 11 行 281 字、深渊秘境 16 行 205 字、进入副本 5 行），被砍到 60 字后玩家看不出这轮到底发生了什么。实测各任务输出 13~281 字，20 条环形上限下每只宠物最多约 6KB，存档无压力；`_assistant_brief` 已删除。渲染把首行时间/任务名加粗、正文原样铺开（保留分隔线与全部行），旧存档里早年的一行摘要没有换行也能正常显示。 v3.11.4 家园流浪商人「聚灵丹」降价（200000 → 50000 玄晶）：流浪商人货架里聚灵丹原价 200000 玄晶（`petpark/data.py` 的 HOMESTEAD_MERCHANT_ITEMS），比道具商城的同名仙丹还贵、且商人 10% 概率才出现、每次只上 3 件货，实际成了三条货里最不值得买的一件；现降到 50000 玄晶，与「史诗卡」同档。只改商人的售价，`data.ITEMS` 里道具商城的聚灵丹（200000 玄晶）原样不动，两条购买路径互不影响；商人货架是每次收取时随机抽的，所以不需要任何数据迁移，已存在的 `merchant_pending` 存档按新价结算。 v3.11.5 助手状态冷却文案去重（玩家反馈）：v3.11.3 给每个档位加上具体剩余时间后，原因文案自己带着任务名，而『助手状态』每行行首已经打了标签，于是渲染成「深渊秘境：深渊秘境冷却中（剩 30分钟）」这样的双写。现改为原因**不自带任务名**（`main.py` 的 `_assistant_ready` / `_assistant_ready_adventure` 共 11 处 `return` 文案去掉前缀），显示为「深渊秘境：冷却中（剩 30分钟）」。只有**实际跑的动作与标签不同**时才点名：「修炼」已婚会自动改跑双修而标签仍写「修炼」，此时显示「修炼：双修冷却中（剩 2分钟）」，否则玩家会以为卡的是修炼的冷却；活动 Boss 的指令名由活动配置给出（线上当前为「秋冬Boss」，与任务名相同），与任务名不同才点名。「砸蛋 / 砸蛋十连」共用冷却，文案改为「冷却中（单发/十连共用，剩 …）」，对两个标签都成立。手动指令（`家园收取` 等）的冷却提示是独立消息、没有行首标签，仍照旧带名字。 v3.12.0 管理后台新增「限时免费使用自动助手」时间窗口（全局生效、一次性起止区间）：运营在后台填开始/结束时间并勾选启用后，窗口期内全服玩家执行自动助手任务**不消耗次数**，且**剩余次数为 0 的玩家也能正常开启与使用**——此前 0 次数玩家在群内发『开启自动助手』会被「次数不足」挡回，玩家中心（门户）的开关同样拒绝。判定口径与限时活动一致（新增 `store.assistant_free_active()`：`enabled` 且 `start_at ≤ now ≤ end_at`，配置存 petpark.json 顶层新键 `assistant_free`），后台新增「免费助手」标签，实时显示当前是否生效（未启用/未开始/生效中/已结束）。实现上**不伪造额度**：`_assistant_tick` 里的三处「额度耗尽即停机」判定与唯一扣次点都按窗口跳过，真实 quota 全程原样保留（0 仍是 0、有次数的也不递减），窗口一过无需任何清理任务即自动恢复原有扣次与停机规则——0 次数玩家会被 tick 重新停机，群内与门户的开机门禁也重新挡住。面板 /『助手状态』/ 开启回执 /「已生效」回执在窗口内追加一行「🎁 限时免费中：执行任务不消耗次数」提示，让玩家看得出为什么没扣次数；窗口未开启时全部文案与行为与旧版逐字一致。 v3.12.1 助手面板按钮改用 QQ 官方「指定用户」权限，非本人点击不再弹提醒：此前面板按钮 permission 写死 type=2（所有人可操作），非本人点别人的助手面板时官方不拦、事件照推，只能靠机器人在服务端比对 owner 再回一句「这不是你的助手面板」。现 `_build_qq_keyboard` 新增 permission_user_ids 参数，助手勾选面板与结果入口按钮传 `specify_user_ids=[面板主人 openid]`、permission 改 type=0（指定用户可操作），由官方客户端在源头挡住非本人——事件根本推不到机器人，提醒自然消失。服务端 owner 兜底判断保留（防老客户端/官方未生效时被点出自己面板），但由弹提醒改为静默 return None，绝不刷屏；手打指令不带 `#` 标记，照常可用。
