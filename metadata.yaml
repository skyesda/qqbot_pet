name: astrbot_plugin_petpark

display_name: 灵契仙途

desc: 灵契仙途：修士职业、灵宠伙伴、真实回合战斗、山海历练、三人秘境、世界首领和深渊抉择；兼容原有存档与玩法。新增多宗门（一界多门、2000天晶建宗、活跃度扩招人数上限）、悟性加点、修士体力、修为翻倍、经验书与形象卡；宗门任务改为目标制（需完成指定任务才领奖）并给宗门操作加冷却；西仓库换品（体力/材料/货币）与商城列表改用md表格；修士卡显示体力、道具效果全中文、体力与翻倍道具改天晶计价；卡片内嵌大图压成WebP（修士卡HTML从~20MB降到~200KB）；新增五行属性克制：灵根决定修士属性、宠物按种类带属性，战斗内克敌伤害×1.2/被克×0.85，修士图补全灵根/神通/属性相克与结契灵宠属性。宝石类材料价格已上限至60万以内。v3.6.0 玩家反馈整改：修士卡/文本补体力条、灵根实际加成(金→攻+10%)、神通被动效果；体力改1点/分钟恢复并在各宗门行动(任务10/探索20/镇守15)标注消耗与去处；修士突破连升N级；新增「外出历练」免费随机历练(15分钟冷却)；宗门任务随机二选一(打怪两次/通关地图一次)须真正去打；宗门捐献改吸灵石(10灵石=1帮贡)；道具商城锻造材料引导、改名卡(宠物)/改名符(修士道号)交叉澄清。v3.6.1 数据隔离修正：「清空本群用户数据」不再清摸金/下棋/扫雷(跨群共享)，家园按群隔离、本群重置只清本群份。v3.6.2 修复无效果指令：「设为无限服/设为官方服/宠物解锁/宠物锁定」仅存在于 dispatch 分支、未注册进 KNOWN_COMMANDS，被群聊分发过滤层 return None 吞掉（看似无效果）；已注册，指令恢复可用。v3.6.3 商城/深渊商店/排行榜等 md 表格统一在表头前加空行，避免 QQ 官方 Markdown 把紧贴标题的表格当成 md 区块（吞成一团），改为正常渲染成表格。v3.7.0 职业系统扩展与卡牌布局重构：新增「魔修」职业（以血催煞·攻击汲取生命，六师九品各具名）；锻造/装备进阶/洗炼改为按修士职业识别装备名（魔修/剑修/体修/灵修各有成套命名，不再只认通用名）；修士卡重构为「修行资源/当前体力/战斗配置/修炼进度」四卡分区 + 灵根神通网格 + 战力构成 + 三列动作栏，并修复长道号与魔修长装备名横向裁切（白字溢出/左右裁断），长文本自动折行。数据 schema_version 升至 7。

