name: astrbot_plugin_petpark

display_name: 灵契仙途

desc: 灵契仙途：修士职业、灵宠伙伴、真实回合战斗、山海历练、三人秘境、世界首领和深渊抉择；兼容原有存档与玩法。新增多宗门（一界多门、2000天晶建宗、活跃度扩招人数上限）、悟性加点、修士体力、修为翻倍、经验书与形象卡；宗门任务改为目标制（需完成指定任务才领奖）并给宗门操作加冷却；西仓库换品（体力/材料/货币）与商城列表改用md表格；修士卡显示体力、道具效果全中文、体力与翻倍道具改天晶计价；卡片内嵌大图压成WebP（修士卡HTML从~20MB降到~200KB）；新增五行属性克制：灵根决定修士属性、宠物按种类带属性，战斗内克敌伤害×1.2/被克×0.85，修士图补全灵根/神通/属性相克与结契灵宠属性。宝石类材料价格已上限至60万以内。v3.6.0 玩家反馈整改：修士卡/文本补体力条、灵根实际加成(金→攻+10%)、神通被动效果；体力改1点/分钟恢复并在各宗门行动(任务10/探索20/镇守15)标注消耗与去处；修士突破连升N级；新增「外出历练」免费随机历练(15分钟冷却)；宗门任务随机二选一(打怪两次/通关地图一次)须真正去打；宗门捐献改吸灵石(10灵石=1帮贡)；道具商城锻造材料引导、改名卡(宠物)/改名符(修士道号)交叉澄清。v3.6.1 数据隔离修正：「清空本群用户数据」不再清摸金/下棋/扫雷(跨群共享)，家园按群隔离、本群重置只清本群份。v3.6.2 修复无效果指令：「设为无限服/设为官方服/宠物解锁/宠物锁定」仅存在于 dispatch 分支、未注册进 KNOWN_COMMANDS，被群聊分发过滤层 return None 吞掉（看似无效果）；已注册，指令恢复可用。v3.6.3 商城/深渊商店/排行榜等 md 表格统一在表头前加空行，避免 QQ 官方 Markdown 把紧贴标题的表格当成 md 区块（吞成一团），改为正常渲染成表格。v3.7.0 职业系统扩展与卡牌布局重构：新增「魔修」职业（以血催煞·攻击汲取生命，六师九品各具名）；锻造/装备进阶/洗炼改为按修士职业识别装备名（魔修/剑修/体修/灵修各有成套命名，不再只认通用名）；修士卡重构为「修行资源/当前体力/战斗配置/修炼进度」四卡分区 + 灵根神通网格 + 战力构成 + 三列动作栏，并修复长道号与魔修长装备名横向裁切（白字溢出/左右裁断），长文本自动折行。数据 schema_version 升至 7。v3.7.1 修复山海仙途图渲染：地图内嵌图（世界背景+20关地标）原为满分辨率 PNG（合计约47MB），拼成单张 HTML 后达 ~63MB，在内存吃紧的渲染机（2核/1.9GB+swap、V8 上限256MB）上触发 set_content 超时 / Page crashed，且超出渲染农场 2MB 上限，导致「仙途地图」恒出「图片暂时生成失败」。现按卡片实际显示尺寸（世界图≈800×1200、地标≈240²）压成 WebP，整图 HTML 降至 ~0.6MB，本地渲染与农场兜底均可正常工作。v3.7.2 修复心情 1 星后玩耍被锁死的死循环：玩耍是唯一能恢复心情的日常动作，但 `_busy_reason` 在心情≤1 时连玩耍一并拦截，又没有恢复心情道具/自动回复，导致宠物心情 1 星 → 玩耍被封 → 无法恢复 → 永久锁死。现玩耍豁免「心情 1 星」门槛（死亡/假死仍照常拦截），心情 1 星时仍可玩耍回满★★★★★。v3.8.0 坐骑外观定制与槽位绑定：后台新增「坐骑定制卡」（兑换解锁已有坐骑外观定制，仅换形象不改名字与战力）；bot.flyyye.cn 玩家中心绑定升级为槽位（群号+用户ID 一次绑定，修士/宠物/坐骑统一管理，纯修士玩家亦可绑定）；我的修士/我的坐骑网页展示；坐骑外观上传走后台人工审核（审核页按 宠物/坐骑 类型筛选）；群聊坐骑入场/卡片优先显示定制外观；「定制坐骑」指令引导网页自助。v3.8.1 定制坐骑形态确定：坐骑定制=新建一只定制坐骑（自定义名+专属外观图，初始战力 30 万，Lv.1 可升级、属性不可自定义；每张坐骑定制卡 1 只，人工审核后生成并自动登场）。

short_desc: 修士职业、灵宠助战、组队秘境与世界首领

version: v3.11.3

author: Devin

repo: https://github.com/skyesda/qqbot_pet

changelog: |-
  v3.9.5 修士气血（当前血量）实装：战斗后气血跨战斗保留并落档，修士卡/文字版「我的修士」/玩家中心均显示 当前气血/上限（此前只有血量上限，看不出战损）；存活每分钟自动回复上限1%，气血归零=陨落（拦截一切出战指令），静养30分钟自愈至30%上限；道具商城新增『回血丹』（400灵石，立即回复50%上限）与『复苏丹』（1000灵石，陨落后立即复活并回复50%）；切磋保持无损不落档。 v3.9.8 修复定制坐骑价值/奖励渲染回归：v3.9.5 曾删除 _mount_value/_mount_reward_range、渲染只读官方 MOUNTS，导致不在 MOUNTS 的定制坐骑「价值/奖励」恒显示 0、入场也不发玄晶；现恢复「实例>官方配置」取值，定制坐骑价值缺省 2 亿、奖励缺省 20万~30万，定制坐骑入场奖励与点击图正确生成。 v3.9.9 坐骑入场/离开卡补底框成对词：坐骑文字信息卡（入场/离开）顶部已有主题词（入场=闪★亮、离开=绝★尘），现按用户要求补一个底部成对词框，与顶部构成上下对称语感——入场「闪★亮/出★行」、离开「绝★尘/而★去」；「我的坐骑」及非入场/离开场景不显示底框，保持原样。 v3.10.0 新增独立招新自动审批模块（脱离宠物乐园，状态独立存 recruitment.json）：群内最大管理员用「开1/关1」开关（默认关闭、不需授权），开启后自动通过入群申请并推送欢迎文案；同时强制关闭宠物乐园旧的全量自动审批与旧版入群欢迎，避免绕过审核与重复推送。 v3.10.1 招新模块定稿：审批轮询改为每 10 秒一次且不再调用 AI（符合条件直接通过）；欢迎语改用定稿文案，并在「欢迎」之后带上申请时填写的答案信息（取 verify_info 的问答答案，缺省退回验证消息）。 v3.10.2 招新审批提速与退群重进修复：轮询间隔 10 秒→5 秒；此前「已欢迎」标记是永久去重，导致退群后重新申请进群不再推送欢迎语，现改为收到新的入群申请即清除该成员的欢迎标记与答案缓存（同时接上群成员退出事件主动清除），退群重进可再次收到欢迎。 v3.10.3 欢迎语排版调整：申请答案不再另起一行挂在底部，改为直接嵌在「🎉热烈欢迎」之后（如「🎉热烈欢迎 计算机2201班 张三 加入信飞工作室招新群！」），其余文案不变；取不到答案时退回昵称，仍取不到则不加。 v3.10.4 关闭宠物乐园旧版退群提醒：此前成员退群会推送「👋 成员退群 成员 @… 已离开本群。」，现硬关 `leave_push`（配置里即使为 true 也不发），退群事件只用于招新模块清除欢迎标记，不再对外发消息。 v3.10.5 招新群彻底静默游戏：群内 `开1` 开启招新后，该群宠物乐园（灵契仙途）全部指令不再响应，框架在本群只放行招新模块；`关1` 在判定之前处理，关闭后本群立即恢复游戏。 v3.10.6 欢迎语改用 QQ 官方 Markdown 排版：标题 `## 🎉 热烈欢迎 <申请答案> 加入信飞工作室招新群！`，「班级 + 姓名」加粗强调，段间统一空行避免单换行被 Markdown 吞掉，末尾用 `━━━` 分隔线 + `>` 引用承载「（上方消息由QQ官方赞助支持）」落款。 v3.10.7 欢迎语回退纯文本：按用户要求去掉 `##` 标题、`**` 加粗、`━━━` 分隔线与 `>` 引用落款，恢复 v3.10.5 的纯文本外观（答案仍嵌在「热烈欢迎」之后）；唯一保留的差异是段间改用空行，避免单换行被 QQ Markdown 吞成一段。 v3.10.8 修复人多时欢迎语静默不发：入群欢迎改为「待发队列 + 错峰发送 + 失败重试」，`on_member_add` 只入队（满队列时快节拍 1.5 秒发一条，空闲回到 5 秒审批节拍），且**只有真正发送成功才标记已欢迎**——此前是先标记再发送，一旦发送失败该成员就永久收不到欢迎且无日志；现失败最多重试 5 次、超限告警并不标记，退群同时清掉待发队列；`send_group` 改为返回布尔成功态；成员加入/跳过/去重/入队全程留日志，便于排查为何不发。 v3.10.9 修复申请答案含换行导致欢迎语标题被劈开：申请人可在输入框内换行（线上真实出现「工软262\n侯文慧」），答案直接内嵌会把标题断成两行，现渲染前把答案中的连续空白（含换行）压成单个空格，纯空白答案退回无答案样式。 v3.10.10 招新审批链路可诊断 + 欢迎不再只依赖入群事件：此前 `tick()` 内除审批外全程静默（查询失败被裸 except 吞掉、角色不足/查到几条申请/审批结果都不留痕），线上出现「有人进群但欢迎没发」时只能靠猜；现每轮记录「机器人角色、申请条数、审批通过/已被其他管理员处理」，攒齐一轮只在有变化时输出一行，稳定后每分钟一次心跳（启用群数/待发条数/已欢迎人数）。同时欢迎改为双触发：入群事件照旧入队，**我们自己审批通过的人直接入队**（延迟 3 秒，等人真正落地），不再单靠实测不保证送达的 `group_member_add` 事件；待发项新增 `due` 时间戳（旧状态文件无此字段按立即发送兼容）。 v3.10.11 炼化宠物卡支持批量：`炼化宠物 宠物卡 [张数|全部]` 一次炼化多张，免去一张一张发指令；实际张数取「想要 / 背包持有 / 玄晶够付」三者最小值，所以「全部」是在钱包允许范围内全炼掉、不会把玄晶扣成负数，被卡住时明确告知原因（背包只有 N 张 / 玄晶只够 N 张）；多张输出按品质汇总成表（品质卡/碎片分列 + 合计），单张沿用原文案、老玩家观感不变。 v3.10.14 新增「修士侦查 用户ID」：与「我的修士」同一出图口径查看本群他人的修士卡（只读、同样受银行逾期拦截，渲染失败回退文字版）；并修复活动奖励显示名未随修士化改名——奖池表/活动商店与抽奖池/领奖回执/伤害榜「获得奖励」列/奖励历史里仍显示旧币种名「钻石」，现统一显示「天晶」（金币/积分同理映射为灵石/玄晶，物品名与活动代币原样不动）；写库、扣费与每日上限仍走原始键，存档零迁移。 v3.10.15 修士战力折算定稿（防「宠物氪金碾压排行」）：灵宠项由「实战战力全额计入」改为 **实战战力×15%**，坐骑项由 projection 估算法改为 **坐骑实战增量×10%**（旧算法漏掉成长曲线与神通/灵根乘区，实测低估 18.7 倍，power 335300 的坐骑算成 76、真实增量 1419），另设「灵宠项 ≤ 本体×0.5」兜底封顶。防霸榜实际靠结构而非封顶——灵宠实战战力按修士等级缩放，修士没练的玩家宠物项自动就小，再叠 15% 折算后宠物项稳定只占本体 7%~24%，排行仍由本体主导（本体占比由 52% 升至 88%）；氪金养的宠在同等本体下照拿满额，保住氪金优待。修士卡/文字版/官网同步展示折算系数与折算前原值，公式透明可核。 v3.10.16 灵宠折算率改为随修士等级爬升：固定 15% 改为动态 r(L)，修士 Lv1 → 0%、Lv999 → 15%（线性）。灵宠实战战力同步与修士等级解耦，改按「满级修士」口径计算——此前 companion_sheet 的 pg 等级缩放已让宠物战力随修士等级变，再叠一层折算率就是两层相乘、低等级被压两次；现只保留 r(L) 这一层（companion_sheet 的 pg 是战斗在用的，绝不动）。满级玩家数值不变，低等级小幅下降（Lv186 约 -8%），无断崖。修士卡/文字版「我的修士」/官网同步显示当前折算率与满级参照。 v3.10.17 灵宠项去掉「本体×0.5」上限：灵宠战力贡献 = 灵宠实战战力 × r(修士等级) 纯乘、不再封顶，防霸榜全交给等级门槛。该保险丝实测从未触发（全服灵宠项/本体最高 18.27%，远低于 50%），故数值零变化，仅公式与三处卡面文案简化。 v3.10.18 去除 log2 压缩：`combat.projection` 由 `weight×log2(1+原值/基准)` 改为线性 `weight×原值/基准`，灵宠与坐骑的原始属性按原值等比计入，不再在对数尾部被压平（此前面板涨 5866 万倍只换 3.4 倍，养成投入被吃掉）。projection 只作用于灵宠属性面 `companion_sheet` 与坐骑攻击加成 `hero_sheet`，修士本体主属性线与敌方强度不受影响。⚠️ 灵宠原始属性当前无上限，去压缩后高养成灵宠线性兑现，实测全服 30 人中 3 名「喂满宠」玩家显著跃升（钢龙 Lv241 灵宠项 8,036→1,208,192 亿，本体占总战力 76.9%→0.000%），中位玩家几乎不变（98.2%→98.1%）。回退只需把 projection 还原 log2 或改幂曲线（指数 0.25 时钢龙灵宠项 16.15 万、本体占 19.5%）。 v3.10.19 装备词条加成上修士卡：此前「修士装备」只显示词条名（如「破军」），玩家无从知道它到底加什么——词条是进阶成功时八选一的百分比乘区（破军攻+6%／御守防+6%／气血血+6%／疾风速+6%／混元全属性各+2%／锐金攻+4%防+2%／木华血+4%速+2%／水火攻+3%血+3%），与神通、灵根同一通道叠加，却只在 hero_sheet 里生效、卡面与面板都看不见。现修士卡每件装备格底部新增一行词条（琥珀金加粗＋金色虚线上分隔）：已觉醒显示「破军 攻+6%」，未觉醒显示灰色「未觉醒词条」（兼作进阶引导）。该行顶替原「提升X」——装备名与属性面板已表达加什么属性，而词条加成本来无处可查。四项同值的混元显示为「全属性+2%」而非罗列四项。装备格可用宽度仅 110px，最长的双属性词条串实测 101px，故不加任何前缀图标以保证单行不折行。八种词条形态已纳入修士卡预览工具与溢出断言。 v3.10.20 修复宗门兑换↔捐献自增殖漏洞（聚灵丹泛滥的根因）：灵石袋原为「50 帮贡→3000 灵石」，而捐献回本线是「10 灵石=1 帮贡」，等价于 50 帮贡→300 帮贡、闭环净赚 6 倍，且宗门兑换自上线起就没有任何每日上限（DAILY_LIMITS 只覆盖任务/镇守/探索），线上被单人刷到 1e25 帮贡，再经玄晶袋兑成玄晶、在商城批量购入聚灵丹（单人 2700 万颗）。现灵石袋发放降至 300 灵石（回本 30 帮贡 < 成本 50，闭环收益 0.6 倍、恒亏），并给宗门兑换加「每日 20 件」上限——按件数而非指令次数计，否则一次 `宗门兑换 灵石袋 999999` 即绕过；兑换发放量改由目录条目的 currency/amount 驱动，不再在发放分支里重写字面量，避免显示与实发漂移（本次改动即踩到这个坑：目录改成 300 而发放仍是硬编码 3000）。 v3.10.21 星辰阁加闸（堵住拿公共库存自肥）：星辰阁合成消耗的是宗门**共享库存（treasury）**帮贡，此前却对全宗任何成员开放，等于谁都能拿公共池给自己买东西（星盘大阵=修为翻倍 3 天、灵材×50）；现改为**仅帮主/长老**可动用，并新增按人计的每日 3 次上限——原有的 300 秒/人冷却只管单人连点，挡不住帮里多个长老各按各的冷却轮着取用同一个库存，故必须再有一道按人计的每日闸。同时把合成表收进 `STAR_ITEMS`（成本/描述/发放量单点定义，不再在分支里重写字面量），无参数时返回帮助并列出可合成物、成本与每日上限；成功回执补上消耗的库存帮贡与今日剩余次数，「宗门帮助」里星辰阁一行同步补注「仅帮主/长老，消耗宗门共享库存」。 v3.10.21 大管理员新增「加次数」（给指定玩家追加当天的转让/赠送次数）：每日转让/赠送上限 10 次，此前没有任何运营侧放宽手段，玩家刷满只能等到明天；现大管理员可发 `加次数 用户ID|@对方 数量`（别名 `加转让次数`/`加赠送次数`）为**指定玩家**追加**当天**的次数上限，回执显示「今日上限 X → Y（今日已用 N 次，还可 M 次）」并注明次日自动恢复。额度写在对方当日的 `_tx_daily.bonus` 里：跨日 `_tx_daily` 整体换新 → 次日自动失效，无需清理任务；只影响被指定的那一个玩家，其余人上限仍是 10。计数上限统一走新的 `_tx_daily_cap()`（基础 10 + 当日追加），次数用尽时的提示会带上「含管理员今日追加 N 次」以免玩家以为还是 10 次。仅大管理员可用（小管理员无权），单次追加上限 100 次，且只放宽次数、不放宽税率/单次上限/自转拦截等其它规则。 v3.10.22 大管理员新增「加道具 / 减道具」（增减指定玩家背包道具）：此前运营想给玩家补发或回收道具只能手改 petpark.json，没有任何指令入口。用法 `加道具 用户ID|@对方 道具名 数量`，数量不设上限但须为正整数；减道具时对方数量不足则报错并**原样不扣**——不做「有多少扣多少」，避免管理员以为清空了、实际只扣到 0，事后对不上账。道具名校验走「使用」同一口径：先查 data.ITEMS，再兜活动道具（活动道具不在静态表里，线上如「桂花酿」有 40 人持有）；减道具额外放行「对方背包里真有」的下线遗留道具，好让运营清理历史残留，而加道具不得凭空造出不存在的道具。回执显示该道具的变动前后数量，归零即删键不留 0 值。 v3.10.23 大管理员新增「封号 / 解封 / 封号状态」（本群封号，被封用户所有指令不可用）：此前群里出现刷屏、捣乱、多开小号套物资时，运营只能踢人，没有任何群内封禁手段。现大管理员可发 `封号 用户ID|@对方` 在本群封禁某用户、`解封 用户ID` 解除、`封号状态 [用户ID]` 查单人或不带ID列出本群全部封号（别名 `封号列表`）。闸门放在「已知指令过滤」之后——**普通聊天仍静默放行**（返回 None、不回复），否则对方在群里随便说句话都会被顶一条封号提示，等于刷屏；但只要是真指令就一律拦下，点歌、清空数据、加金币、乃至小管理员自己的加币指令无一例外，口令抽奖因排在过滤之前另单独拦了一次。封号只作用于本群（名单存在群档案的 `banned` 里，与 `subadmins` 同构），换个群照常游玩；且**不要求对方已在本群参与过**——要封的多半正是刷完就跑、或还没落档就来捣乱的人，先要求他注册才肯封等于留了个绕过的口子。收礼同步封死：物品/货币/宠物/坐骑四条转让路径都汇到 `_check_transfer_limit`，在那里按**收方**拦一道「对方已被封号，无法接收转让/赠送」，并刻意排在大管理员豁免与无限服豁免**之前**——豁免的是发方的税与次数，不该顺带把「收方能不能收」也放开，否则大管理员一转、或换个无限服，就等于替被封用户留了后门。**大管理员不可被封**（封号指令直接拒绝并提示改从后台 admins 配置移除），避免管理员之间互相锁死；闸门另对大管理员整体豁免，兜住「先被封、后晋升」的人被自己的旧记录锁在门外。判定「某ID是否为大管理员」统一走新增的 `_is_admin_id()`（含绑定QQ号兜底反查），原 `_is_admin()` 改为调用它，行为不变。 v3.10.24 封号支持「天数」与「永久」：v3.10.23 的封号只有永久一种，运营想惩戒三天还得手动记着解封。现`封号 用户ID|@对方 [天数]`——**不填天数即永久**，填了就封 N 天；另加显式别名 `永久封号 用户ID`（与不填天数等价），已注册进 KNOWN_COMMANDS 与 WEB_BLOCKED_COMMANDS。存档形态由 list 改为 **{用户ID: 到期时间戳}**（永久记 0），到期判断放在读取时（与「加次数」当日额度同一思路），**不需要任何清理任务**；同时兼容旧 list 形态（一律视为永久），且所有写路径都经 `_ban_store()` 规范化 + 顺手清掉已到期条目，名单不会越积越多。重封语义：**按新天数重新计时**（覆盖而非叠加，所以 `封号 x 7` 后再 `封号 x 30` 是剩 30 天；也能用它缩短），但**永久封号不被有限天数降格**——否则一次手滑就把永久封悄悄解成了限期，此时明确回执提示「先解封再重新封」。天数参数写错（0 / 负数 / `abc` / `3.5`）一律报用法错误而不是静默当成永久，避免「本想封 3 天、结果封到天荒地老」；`永久封号` 额外不接受天数参数。回执与 `封号状态` 都带上剩余时间（`3 天 5 小时` / `30 分钟` / `永久`），名单表加「剩余」列；被封用户自己收到的提示也带上「剩余 X」，否则他只能反复试指令来猜还要等多久。解封与转让拦截（`_check_transfer_limit` 按收方拦）、群管理指令闸门（`_staff_cmd_blocked`）、口令抽奖闸门均已随之按「生效中」判断——到期的封号自动失效，无需人工介入。 v3.10.25 大管理员新增「违规词管理（加 / 减 / 查看）」（本群命中即撤回该成员消息）：群里骂战、刷屏脏话此前只能靠管理员盯屏手动撤回。现大管理员可发 `加违规词 死 滚 傻逼`（一次可加多个，空格分隔）、`减违规词 滚`（移除）、`违规词`（列出本群全部）、`违规词 死`（查某个词在不在），词表按群存在群档案 `badwords` 里（与 `subadmins`/`banned` 同构），别的群不受影响。匹配是**子串**而非分词——设置「死」时「你去死」也命中，一个字的词照样触发（需求原话）；匹配前统一去掉全部空白并转小写，故「去 死」这类拆字写法和英文大小写变体一并命中。命中处置按发送者身份分流：**群成员（含群身份取不到时）→ 撤回该条消息**并 @ 对方发一条「含违规内容，已撤回」；**群主/管理员 → 只发提醒不撤回**；**大管理员 → 整体豁免**——否则「加违规词 死」这条指令自己就含违规词、会被自己的规则撤回，词根本加不进去；豁免看的是身份而非「内容像不像指令」，同一句话普通成员发照样撤回。回执里刻意**不写命中的是哪个词**（写了等于公开词表，玩家照着绕），命中词只落日志供运营回头调词表。检测为**即时检查 + 后台每 10 秒兜底重扫**：群消息一到就查（QQ 撤回窗口只有 2 分钟，越早越好），同时把每条群消息截断后记进每群上限 100 条的缓冲，由 10 秒轮询重扫——兜的是即时检查**必然漏掉**的两类：① 消息发出**之后**才把某个词加进词表（即时检查当时词表里还没有它）；② 即时检查半路抛异常被外层 except 吞掉（那条消息就再没人管了）。两条路靠 `_badword_done`（按群记已处置消息ID，随手清掉滑出缓冲的）去重，同一条不会撤两次。撤回失败（超 2 分钟窗口／机器人不是群管理员）自动退化成提醒，不让违规者以为没被罚。词表写入有界：单词上限 30 字（太长会误伤整段话）、每群上限 100 条（匹配跑在每条群消息上），超限明确报错而非静默丢弃；移除不存在的词、重复添加也各有明确回执。（另：本次顺带修复 `metadata.yaml` 第 15 行的历史问题——该行原本没有 key、直接顶着正文，使整个文件不是合法 YAML，框架 `core/plugin.py` 的 `list_plugins` 解析时抛异常并被 `except` 静默吞掉，插件列表里的插件名与版本号一直退化成目录名 + 空；现改写为合法的 `changelog: |-` 块标量。） v3.10.26 「进入副本 / 挑战神仙」支持省略参数、自动打当前等级可进的最高档：此前不带名称只会回一句用法提示（「用法：进入副本 副本名称」/「用法：挑战神仙 等级」），玩家得先发 `宠物副本` 翻列表、自己数到最高档再抄一遍名字。现直接发 `进入副本` 即自动选中「等级门槛 ≤ 当前宠物等级」里**最高**的那一档（20 级 → 魔之森林，120 级 → 烈焰魔窟），`挑战神仙` 同理在 120~220 中自动选最高可进档；带参数的旧用法与文案完全不变。选档按 `level_req` 显式取 max，不依赖配置字典的书写顺序；连最低门槛（Lv10 / Lv120）都没到则明确回「还没有达到任何副本的等级门槛（最低 Lv10）」并引导去发 `宠物副本` 看列表，而不是替他挑一个必败的副本。副本列表与飞升副本列表底部、`帮助` 的历练征伐段、AI 路由指令表均补注该用法。 v3.11.0 「自动修炼」升级为「自动助手」（次数卡制，按宠物勾选最多 4 个任务后台代跑）：旧版挂机只会在「已飞升→幻境寻宝」「未飞升→双修/修炼」之间二选一，其余 16 个日常玩法都得手打；现支持 修炼（已婚自动转双修）/进入副本/挑战神仙/外出历练/秋冬Boss/深渊秘境/宠物神仙劫/砸蛋/砸蛋十连/打工/学习/洗髓/探险/冥想/幻境寻宝/家园收取/约会/修士修炼/修士突破 共 19 项，群内发 `自动助手` 弹按钮面板勾选（每行 4 个、共 5 行，正好卡在 QQ 官方 5 行上限内），点「确定生效」落档，后台每 30 秒按勾选顺序把「冷却已好且资源够」的任务跑一遍，结果静默写入宠物日志（`助手状态` 可查最近 20 条），不在群里刷屏。计费从「按天无限挂机」改为「按次」：1 张自动助手卡 = 500 次，每成功执行 1 个任务扣 1 次，次数归零自动停机；额度是玩家级（同群所有宠物共享一个池），勾选是宠物级（每只宠物独立一套，最多 4 个）。配套清理：删除全部 85 张旧「自动修炼卡」卡密，152 个玩家身上残留的旧 `auto_cultivation` 记录（其中 18 个还有未过期的权限时间、7 只宠物正在挂机）一律清零、不补偿（迁移前自动备份 petpark.json 为 .pre_assistant_migration.bak），定制宠物不再是永久免费旁路；「自动修炼卡」道具（含功德商店 200 功德档、生辰抽奖库存 94 张）改名为「自动助手卡」——**是改名不是删除**，抽奖库存与背包里的旧名条目保留数量跟随改名。按钮改用 QQ 官方 `action.type=1` 回调按钮，点击只在服务端产生互动事件、不再往群里发一条「@机器人 助手选 N」的玩家消息（需框架开启 interaction intent 1<<26 并实现 `on_interaction_create`；官方 schema 里 `enter` 是指令按钮专用，回调按钮必须不带，故 `_build_qq_keyboard` 按 action_type 分流构造）。面板每次点击仍会重发一条（QQ 无消息编辑能力，且互动事件的 `PUT /interactions/{id}` 响应体只能带 code）；互动事件不带 `member_role`，合成事件的 sender_role 为空，所以只有助手面板改用回调按钮，其余既有按钮保持指令按钮不动。门户（bot.flyyye.cn）的自动修炼开关改为「看剩余次数」并对所有宠物开放（原先只有定制/飞升宠物能看见），未勾选任务时明确拒绝开启并引导回群里勾选；顺带修复门户卡密兑换的成功判定——此前用「兑换成功」四字匹配，而助手卡的成功文案是「自动助手卡使用成功」，导致成功兑换却报 ok:false。旧指令 `自动修炼`/`开启自动修炼`/`关闭自动修炼`/`自动修炼状态`/`修炼状态`/`修炼卡` 全部保留为隐藏别名，玩家肌肉记忆不受影响。 v3.11.1 助手面板按钮改光标签（玩家反馈「不要有表情前面，文字显示全」）：真机实测 QQ 对按钮 label 卡约 6 字节，超出即被截成「首字 + ...」（神仙劫→神...、家园收取→家...，而 2 个汉字的 砸蛋/打工/学习 完整显示）；按钮右侧大片留白说明卡的是**字节数**而非宽度，减少每行按钮数救不了。故把 19 个任务标签统一压到 2 个字（修炼/副本/神仙/历练/活动/深渊/仙劫/砸蛋/十连/打工/学习/洗髓/探险/冥想/寻宝/家园/约会/修士/突破），「确定生效」压成「确定」，并去掉 ✅/⬜ 前缀（⬜砸蛋 = 9 字节必被截）。勾选态改由面板正文加粗的「已选 N/4：…」一行呈现（那里用完整任务名，无长度限制），正文并注明「按钮上是简称，完整任务名以已选与助手状态为准」；「助手状态」页仍用完整 key 显示任务名，不受影响。 v3.11.2 助手面板两处体验修复（玩家反馈）：①「已生效」/「助手状态」这类**结果类回复**底下改挂**单个入口按钮**——已勾选显示「修改」（回去重挑那 4 个任务）、未勾选显示「选择」（提醒去勾选），不再整块贴 20 个按钮（玩家会误以为那是本次结果的可选项，既冗余又容易误点）；「自动助手」/「助手选」/「助手清空」这些**面板本身**的指令仍出完整 19+1 按钮。②助手面板按钮改为**绑定主人**：回调按钮是群里任何人都能点的，此前别人点你的面板会弹出**他自己的**面板并操作他自己的助手，从旁看像在改别人的配置；现在按钮载荷尾带 `#<openid>`（面板主人），分发时核对点击者，非本人点击直接回「这不是你的助手面板」并引导发送『自动助手』开自己的面板，既不弹面板也不改动任何人的待选态/宠物配置。手打指令不带该标记，照常可用。 v3.11.3 助手状态两处显示修复（玩家反馈）：① 每个任务的档位原因不再只写「冷却中」，一律带上**具体剩余时间**（`打工冷却中（剩 12分30秒）`、`砸蛋冷却中（单发/十连共用，剩 1分30秒）`），否则玩家无法判断还要等多久、该不该继续挂机；格式化复用既有的 `_fmt_duration`（分/秒，全玩法冷却最长 30 分钟，无需小时位）。修士轴两处特殊文案：『修士修炼』是修为还在积累而非冷却，写「修为积累中（还需 42秒）」；秋冬Boss 处于复活窗口时写「『X』正在复活（剩 …）」。② 「最近执行」不再截断，存**完整结果正文**：此前每轮只存「首行前 60 字」（_assistant_brief），而实战报是 5~16 行（外出历练 11 行 281 字、深渊秘境 16 行 205 字、进入副本 5 行），被砍到 60 字后玩家看不出这轮到底发生了什么。实测各任务输出 13~281 字，20 条环形上限下每只宠物最多约 6KB，存档无压力；`_assistant_brief` 已删除。渲染把首行时间/任务名加粗、正文原样铺开（保留分隔线与全部行），旧存档里早年的一行摘要没有换行也能正常显示。
