name: astrbot_plugin_petpark

display_name: 灵契仙途

desc: 灵契仙途：修士职业、灵宠伙伴、真实回合战斗、山海历练、三人秘境、世界首领和深渊抉择；兼容原有存档与玩法。新增多宗门（一界多门、2000天晶建宗、活跃度扩招人数上限）、悟性加点、修士体力、修为翻倍、经验书与形象卡；宗门任务改为目标制（需完成指定任务才领奖）并给宗门操作加冷却；西仓库换品（体力/材料/货币）与商城列表改用md表格；修士卡显示体力、道具效果全中文、体力与翻倍道具改天晶计价；卡片内嵌大图压成WebP（修士卡HTML从~20MB降到~200KB）；新增五行属性克制：灵根决定修士属性、宠物按种类带属性，战斗内克敌伤害×1.2/被克×0.85，修士图补全灵根/神通/属性相克与结契灵宠属性。宝石类材料价格已上限至60万以内。v3.6.0 玩家反馈整改：修士卡/文本补体力条、灵根实际加成(金→攻+10%)、神通被动效果；体力改1点/分钟恢复并在各宗门行动(任务10/探索20/镇守15)标注消耗与去处；修士突破连升N级；新增「外出历练」免费随机历练(15分钟冷却)；宗门任务随机二选一(打怪两次/通关地图一次)须真正去打；宗门捐献改吸灵石(10灵石=1帮贡)；道具商城锻造材料引导、改名卡(宠物)/改名符(修士道号)交叉澄清。v3.6.1 数据隔离修正：「清空本群用户数据」不再清摸金/下棋/扫雷(跨群共享)，家园按群隔离、本群重置只清本群份。v3.6.2 修复无效果指令：「设为无限服/设为官方服/宠物解锁/宠物锁定」仅存在于 dispatch 分支、未注册进 KNOWN_COMMANDS，被群聊分发过滤层 return None 吞掉（看似无效果）；已注册，指令恢复可用。v3.6.3 商城/深渊商店/排行榜等 md 表格统一在表头前加空行，避免 QQ 官方 Markdown 把紧贴标题的表格当成 md 区块（吞成一团），改为正常渲染成表格。v3.7.0 职业系统扩展与卡牌布局重构：新增「魔修」职业（以血催煞·攻击汲取生命，六师九品各具名）；锻造/装备进阶/洗炼改为按修士职业识别装备名（魔修/剑修/体修/灵修各有成套命名，不再只认通用名）；修士卡重构为「修行资源/当前体力/战斗配置/修炼进度」四卡分区 + 灵根神通网格 + 战力构成 + 三列动作栏，并修复长道号与魔修长装备名横向裁切（白字溢出/左右裁断），长文本自动折行。数据 schema_version 升至 7。v3.7.1 修复山海仙途图渲染：地图内嵌图（世界背景+20关地标）原为满分辨率 PNG（合计约47MB），拼成单张 HTML 后达 ~63MB，在内存吃紧的渲染机（2核/1.9GB+swap、V8 上限256MB）上触发 set_content 超时 / Page crashed，且超出渲染农场 2MB 上限，导致「仙途地图」恒出「图片暂时生成失败」。现按卡片实际显示尺寸（世界图≈800×1200、地标≈240²）压成 WebP，整图 HTML 降至 ~0.6MB，本地渲染与农场兜底均可正常工作。v3.7.2 修复心情 1 星后玩耍被锁死的死循环：玩耍是唯一能恢复心情的日常动作，但 `_busy_reason` 在心情≤1 时连玩耍一并拦截，又没有恢复心情道具/自动回复，导致宠物心情 1 星 → 玩耍被封 → 无法恢复 → 永久锁死。现玩耍豁免「心情 1 星」门槛（死亡/假死仍照常拦截），心情 1 星时仍可玩耍回满★★★★★。v3.8.0 坐骑外观定制与槽位绑定：后台新增「坐骑定制卡」（兑换解锁已有坐骑外观定制，仅换形象不改名字与战力）；bot.flyyye.cn 玩家中心绑定升级为槽位（群号+用户ID 一次绑定，修士/宠物/坐骑统一管理，纯修士玩家亦可绑定）；我的修士/我的坐骑网页展示；坐骑外观上传走后台人工审核（审核页按 宠物/坐骑 类型筛选）；群聊坐骑入场/卡片优先显示定制外观；「定制坐骑」指令引导网页自助。v3.8.1 定制坐骑形态确定：坐骑定制=新建一只定制坐骑（自定义名+专属外观图，初始战力 30 万，Lv.1 可升级、属性不可自定义；每张坐骑定制卡 1 只，人工审核后生成并自动登场）。

short_desc: 修士职业、灵宠助战、组队秘境与世界首领

version: v3.10.17

author: Devin

repo: https://github.com/skyesda/qqbot_pet

v3.9.5 修士气血（当前血量）实装：战斗后气血跨战斗保留并落档，修士卡/文字版「我的修士」/玩家中心均显示 当前气血/上限（此前只有血量上限，看不出战损）；存活每分钟自动回复上限1%，气血归零=陨落（拦截一切出战指令），静养30分钟自愈至30%上限；道具商城新增『回血丹』（400灵石，立即回复50%上限）与『复苏丹』（1000灵石，陨落后立即复活并回复50%）；切磋保持无损不落档。 v3.9.8 修复定制坐骑价值/奖励渲染回归：v3.9.5 曾删除 _mount_value/_mount_reward_range、渲染只读官方 MOUNTS，导致不在 MOUNTS 的定制坐骑「价值/奖励」恒显示 0、入场也不发玄晶；现恢复「实例>官方配置」取值，定制坐骑价值缺省 2 亿、奖励缺省 20万~30万，定制坐骑入场奖励与点击图正确生成。 v3.9.9 坐骑入场/离开卡补底框成对词：坐骑文字信息卡（入场/离开）顶部已有主题词（入场=闪★亮、离开=绝★尘），现按用户要求补一个底部成对词框，与顶部构成上下对称语感——入场「闪★亮/出★行」、离开「绝★尘/而★去」；「我的坐骑」及非入场/离开场景不显示底框，保持原样。 v3.10.0 新增独立招新自动审批模块（脱离宠物乐园，状态独立存 recruitment.json）：群内最大管理员用「开1/关1」开关（默认关闭、不需授权），开启后自动通过入群申请并推送欢迎文案；同时强制关闭宠物乐园旧的全量自动审批与旧版入群欢迎，避免绕过审核与重复推送。 v3.10.1 招新模块定稿：审批轮询改为每 10 秒一次且不再调用 AI（符合条件直接通过）；欢迎语改用定稿文案，并在「欢迎」之后带上申请时填写的答案信息（取 verify_info 的问答答案，缺省退回验证消息）。 v3.10.2 招新审批提速与退群重进修复：轮询间隔 10 秒→5 秒；此前「已欢迎」标记是永久去重，导致退群后重新申请进群不再推送欢迎语，现改为收到新的入群申请即清除该成员的欢迎标记与答案缓存（同时接上群成员退出事件主动清除），退群重进可再次收到欢迎。 v3.10.3 欢迎语排版调整：申请答案不再另起一行挂在底部，改为直接嵌在「🎉热烈欢迎」之后（如「🎉热烈欢迎 计算机2201班 张三 加入信飞工作室招新群！」），其余文案不变；取不到答案时退回昵称，仍取不到则不加。 v3.10.4 关闭宠物乐园旧版退群提醒：此前成员退群会推送「👋 成员退群 成员 @… 已离开本群。」，现硬关 `leave_push`（配置里即使为 true 也不发），退群事件只用于招新模块清除欢迎标记，不再对外发消息。 v3.10.5 招新群彻底静默游戏：群内 `开1` 开启招新后，该群宠物乐园（灵契仙途）全部指令不再响应，框架在本群只放行招新模块；`关1` 在判定之前处理，关闭后本群立即恢复游戏。 v3.10.6 欢迎语改用 QQ 官方 Markdown 排版：标题 `## 🎉 热烈欢迎 <申请答案> 加入信飞工作室招新群！`，「班级 + 姓名」加粗强调，段间统一空行避免单换行被 Markdown 吞掉，末尾用 `━━━` 分隔线 + `>` 引用承载「（上方消息由QQ官方赞助支持）」落款。 v3.10.7 欢迎语回退纯文本：按用户要求去掉 `##` 标题、`**` 加粗、`━━━` 分隔线与 `>` 引用落款，恢复 v3.10.5 的纯文本外观（答案仍嵌在「热烈欢迎」之后）；唯一保留的差异是段间改用空行，避免单换行被 QQ Markdown 吞成一段。 v3.10.8 修复人多时欢迎语静默不发：入群欢迎改为「待发队列 + 错峰发送 + 失败重试」，`on_member_add` 只入队（满队列时快节拍 1.5 秒发一条，空闲回到 5 秒审批节拍），且**只有真正发送成功才标记已欢迎**——此前是先标记再发送，一旦发送失败该成员就永久收不到欢迎且无日志；现失败最多重试 5 次、超限告警并不标记，退群同时清掉待发队列；`send_group` 改为返回布尔成功态；成员加入/跳过/去重/入队全程留日志，便于排查为何不发。 v3.10.9 修复申请答案含换行导致欢迎语标题被劈开：申请人可在输入框内换行（线上真实出现「工软262\n侯文慧」），答案直接内嵌会把标题断成两行，现渲染前把答案中的连续空白（含换行）压成单个空格，纯空白答案退回无答案样式。 v3.10.10 招新审批链路可诊断 + 欢迎不再只依赖入群事件：此前 `tick()` 内除审批外全程静默（查询失败被裸 except 吞掉、角色不足/查到几条申请/审批结果都不留痕），线上出现「有人进群但欢迎没发」时只能靠猜；现每轮记录「机器人角色、申请条数、审批通过/已被其他管理员处理」，攒齐一轮只在有变化时输出一行，稳定后每分钟一次心跳（启用群数/待发条数/已欢迎人数）。同时欢迎改为双触发：入群事件照旧入队，**我们自己审批通过的人直接入队**（延迟 3 秒，等人真正落地），不再单靠实测不保证送达的 `group_member_add` 事件；待发项新增 `due` 时间戳（旧状态文件无此字段按立即发送兼容）。 v3.10.11 炼化宠物卡支持批量：`炼化宠物 宠物卡 [张数|全部]` 一次炼化多张，免去一张一张发指令；实际张数取「想要 / 背包持有 / 玄晶够付」三者最小值，所以「全部」是在钱包允许范围内全炼掉、不会把玄晶扣成负数，被卡住时明确告知原因（背包只有 N 张 / 玄晶只够 N 张）；多张输出按品质汇总成表（品质卡/碎片分列 + 合计），单张沿用原文案、老玩家观感不变。 v3.10.14 新增「修士侦查 用户ID」：与「我的修士」同一出图口径查看本群他人的修士卡（只读、同样受银行逾期拦截，渲染失败回退文字版）；并修复活动奖励显示名未随修士化改名——奖池表/活动商店与抽奖池/领奖回执/伤害榜「获得奖励」列/奖励历史里仍显示旧币种名「钻石」，现统一显示「天晶」（金币/积分同理映射为灵石/玄晶，物品名与活动代币原样不动）；写库、扣费与每日上限仍走原始键，存档零迁移。 v3.10.15 修士战力折算定稿（防「宠物氪金碾压排行」）：灵宠项由「实战战力全额计入」改为 **实战战力×15%**，坐骑项由 projection 估算法改为 **坐骑实战增量×10%**（旧算法漏掉成长曲线与神通/灵根乘区，实测低估 18.7 倍，power 335300 的坐骑算成 76、真实增量 1419），另设「灵宠项 ≤ 本体×0.5」兜底封顶。防霸榜实际靠结构而非封顶——灵宠实战战力按修士等级缩放，修士没练的玩家宠物项自动就小，再叠 15% 折算后宠物项稳定只占本体 7%~24%，排行仍由本体主导（本体占比由 52% 升至 88%）；氪金养的宠在同等本体下照拿满额，保住氪金优待。修士卡/文字版/官网同步展示折算系数与折算前原值，公式透明可核。 v3.10.16 灵宠折算率改为随修士等级爬升：固定 15% 改为动态 r(L)，修士 Lv1 → 0%、Lv999 → 15%（线性）。灵宠实战战力同步与修士等级解耦，改按「满级修士」口径计算——此前 companion_sheet 的 pg 等级缩放已让宠物战力随修士等级变，再叠一层折算率就是两层相乘、低等级被压两次；现只保留 r(L) 这一层（companion_sheet 的 pg 是战斗在用的，绝不动）。满级玩家数值不变，低等级小幅下降（Lv186 约 -8%），无断崖。修士卡/文字版「我的修士」/官网同步显示当前折算率与满级参照。 v3.10.17 灵宠项去掉「本体×0.5」上限：灵宠战力贡献 = 灵宠实战战力 × r(修士等级) 纯乘、不再封顶，防霸榜全交给等级门槛。该保险丝实测从未触发（全服灵宠项/本体最高 18.27%，远低于 50%），故数值零变化，仅公式与三处卡面文案简化。
