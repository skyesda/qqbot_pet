name: astrbot_plugin_petpark

display_name: 灵契仙途

desc: 灵契仙途：修士职业、灵宠伙伴、真实回合战斗、山海历练、三人秘境、世界首领和深渊抉择；兼容原有存档与玩法。新增多宗门（一界多门、2000天晶建宗、活跃度扩招人数上限）、悟性加点、修士体力、修为翻倍、经验书与形象卡；宗门任务改为目标制（需完成指定任务才领奖）并给宗门操作加冷却；西仓库换品（体力/材料/货币）与商城列表改用md表格；修士卡显示体力、道具效果全中文、体力与翻倍道具改天晶计价；卡片内嵌大图压成WebP（修士卡HTML从~20MB降到~200KB）；新增五行属性克制：灵根决定修士属性、宠物按种类带属性，战斗内克敌伤害×1.2/被克×0.85，修士图补全灵根/神通/属性相克与结契灵宠属性。宝石类材料价格已上限至60万以内。v3.6.0 玩家反馈整改：修士卡/文本补体力条、灵根实际加成(金→攻+10%)、神通被动效果；体力改1点/分钟恢复并在各宗门行动(任务10/探索20/镇守15)标注消耗与去处；修士突破连升N级；新增「外出历练」免费随机历练(15分钟冷却)；宗门任务随机二选一(打怪两次/通关地图一次)须真正去打；宗门捐献改吸灵石(10灵石=1帮贡)；道具商城锻造材料引导、改名卡(宠物)/改名符(修士道号)交叉澄清。v3.6.1 数据隔离修正：「清空本群用户数据」不再清摸金/下棋/扫雷(跨群共享)，家园按群隔离、本群重置只清本群份。

short_desc: 修士职业、灵宠助战、组队秘境与世界首领

